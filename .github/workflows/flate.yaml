---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLATE_NO_PROGRESS: "true"
  # Rendering from kubernetes/flux/cluster needs the cluster-vars Secret, which exists only in the cluster
  FLATE_PATH: kubernetes/apps

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*
            .github/workflows/flate.yaml

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0

      # The setup action exports FLATE_BASE, which makes flate test only what the pull request changed
      - name: Run flate test
        run: flate test --base=

  bootstrap-parity:
    name: Bootstrap - Helmfile Parity
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: "${{ steps.app-token.outputs.token }}"

      - name: Install tools
        env:
          HELM_INSTALL_SCRIPT: >-
            https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          HELMFILE_ARCHIVE: >-
            https://github.com/helmfile/helmfile/releases/download/v1.8.1/helmfile_1.8.1_linux_amd64.tar.gz
          YQ_BINARY: >-
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
        run: |-
          sudo apt-get update
          sudo apt-get install --yes curl gzip jq tar

          curl --fail --silent --show-error --location \
            --output /tmp/yq \
            "${YQ_BINARY}"
          sudo install --mode 0755 /tmp/yq /usr/local/bin/yq

          curl --fail --silent --show-error --location \
            "${HELM_INSTALL_SCRIPT}" \
            | DESIRED_VERSION=v4.3.0 bash

          curl --fail --silent --show-error --location \
            --output /tmp/helmfile.tar.gz \
            "${HELMFILE_ARCHIVE}"
          tar --extract --gzip --file /tmp/helmfile.tar.gz \
            --directory /tmp helmfile
          sudo install --mode 0755 /tmp/helmfile /usr/local/bin/helmfile

      - name: Run bootstrap Helmfile parity check
        run: scripts/bootstrap-helmfile-parity.sh

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Diff
    runs-on: ubuntu-latest
    outputs:
      diff: ${{ steps.diff.outputs.diff }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0

      # HEAD is the pull request's merge commit, so its first parent is the base it merges into
      - name: Run flate diff
        run: flate diff --base HEAD~1 --output github > "${RUNNER_TEMP}/flate.diff"

      - name: Generate Diff
        id: diff
        run: |-
          delimiter="$(openssl rand -hex 16)"
          {
            echo "diff<<${delimiter}"
            # A pull request comment holds 65536 characters
            awk '{ size += length($0) + 1 } size > 60000 { print "... diff truncated"; exit } { print }' \
              "${RUNNER_TEMP}/flate.diff"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  # A separate job, so the code that renders the pull request never runs beside the bot token
  comment:
    if: >-
      ${{
        needs.diff.outputs.diff != '' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: diff
    name: Flate - Comment
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          permission-pull-requests: write

      - name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
          header: "${{ github.event.pull_request.number }}/kubernetes/flate"
          message: |-
            ```diff
            ${{ needs.diff.outputs.diff }}
            ```

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - bootstrap-parity
      - diff
    # The main ruleset requires a status with this name
    name: Flux Local - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
