---
# Seeds Flux substitution vars before External Secrets is ready.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
stringData:
  SECRET_PUBLIC_DOMAIN: op://k8s/cluster-secrets/SECRET_PUBLIC_DOMAIN
  SECRET_PUBLIC_ANON_DOMAIN: op://k8s/cluster-secrets/SECRET_PUBLIC_ANON_DOMAIN
  SECRET_PLEX_DOMAIN: op://k8s/cluster-secrets/SECRET_PLEX_DOMAIN
  SECRET_CLOUDFLARE_EMAIL: op://k8s/cluster-secrets/SECRET_CLOUDFLARE_EMAIL
  SECRET_CLOUDFLARE_ACCOUNT_ID: op://k8s/cluster-secrets/SECRET_CLOUDFLARE_ACCOUNT_ID
  SECRET_CLOUDFLARE_TUNNEL_ID: op://k8s/cluster-secrets/SECRET_CLOUDFLARE_TUNNEL_ID
  SECRET_NFS_DOMAIN: op://k8s/cluster-secrets/SECRET_NFS_DOMAIN
  SECRET_SIGENERGY_IP: op://k8s/cluster-secrets/SECRET_SIGENERGY_IP
  TZ: op://k8s/cluster-secrets/TZ
