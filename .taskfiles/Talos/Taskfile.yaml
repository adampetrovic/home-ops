---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
  TALOS_VERSION: v1.14.0
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  KUBERNETES_VERSION: v1.36.3
  TALOS_SCRIPTS_DIR: "{{.ROOT_DIR}}/.taskfiles/Talos/scripts"
  TALOS_NODES: k8s-node-1,k8s-node-2,k8s-node-3,k8s-node-4,k8s-node-5

tasks:
  render-config:
    aliases: [render]
    desc: Render native Talos machine config for one node to stdout [node=required]
    cmd: "{{.TALOS_SCRIPTS_DIR}}/render-config.sh {{.node}}"
    requires:
      vars: [node]
    preconditions:
      - test -f {{.TALOS_DIR}}/cluster.yaml.j2
      - test -f {{.TALOS_DIR}}/inventory.yaml
      - which talosctl
      - which op

  render-all:
    desc: Render all native Talos machine configs to /dev/null [no files written]
    cmd: |
      IFS="," read -ra nodes <<< "{{.TALOS_NODES}}"
      for node in "${nodes[@]}"; do
          {{.TALOS_SCRIPTS_DIR}}/render-config.sh "${node}" >/dev/null
      done
    preconditions:
      - test -f {{.TALOS_DIR}}/cluster.yaml.j2

  talosconfig:
    desc: Generate a Talos client config from 1Password-backed secrets [talosconfig=$HOME/.talos/config]
    cmd: |
      talosconfig="{{.talosconfig}}"
      mkdir -p "$(dirname "${talosconfig}")"
      tmp_secrets="$(mktemp)"
      trap 'rm -f "${tmp_secrets}"' EXIT
      {{.TALOS_SCRIPTS_DIR}}/template.sh {{.TALOS_DIR}}/secrets.yaml.j2 > "${tmp_secrets}"
      talosctl gen config home-kubernetes https://10.0.80.99:6443 \
          --with-secrets "${tmp_secrets}" \
          --output "${talosconfig}" \
          --output-types talosconfig \
          --with-docs=false \
          --with-examples=false \
          --force >/dev/null
      talosctl --talosconfig "${talosconfig}" config endpoint 10.0.80.99
      talosctl --talosconfig "${talosconfig}" config node 10.0.80.10 10.0.80.11 10.0.80.12 10.0.80.13 10.0.80.14
    vars:
      talosconfig: '{{.talosconfig | default "$HOME/.talos/config"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.yaml.j2
      - which talosctl
      - which op

  schematic-id:
    desc: Resolve Talos Image Factory schematic ID [node=optional]
    cmd: "{{.TALOS_SCRIPTS_DIR}}/schematic-id.sh {{.node}}"

  machine-image:
    desc: Render and print a node's UnattendedInstall installer image [node=required]
    cmd: "{{.TALOS_SCRIPTS_DIR}}/machine-image.sh {{.node}}"
    requires:
      vars: [node]

  node-address:
    desc: Print a node's Talos management address from talos/inventory.yaml [node=required]
    cmd: "{{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}}"
    requires:
      vars: [node]

  validate:
    desc: Validate rendered native Talos config for one node [node=required]
    cmd: |
      {{.TALOS_SCRIPTS_DIR}}/render-config.sh {{.node}} \
          | talosctl validate --mode=metal --strict --config /dev/stdin
    requires:
      vars: [node]
    preconditions:
      - which talosctl

  validate-all:
    desc: Validate rendered native Talos configs for every node
    cmds:
      - for: { var: TALOS_NODES, split: "," }
        task: validate
        vars:
          node: "{{.ITEM}}"

  dry-run:
    desc: Render and dry-run apply native Talos config against one live node [node=required]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      {{.TALOS_SCRIPTS_DIR}}/render-config.sh {{.node}} \
          | talosctl --nodes "${node_address}" apply-config --dry-run -f /dev/stdin
    requires:
      vars: [node]
    preconditions:
      - talosctl config info >/dev/null 2>&1

  dry-run-all:
    desc: Dry-run rendered native Talos config against every live node
    cmds:
      - for: { var: TALOS_NODES, split: "," }
        task: dry-run
        vars:
          node: "{{.ITEM}}"

  apply-node:
    aliases: [apply]
    desc: Apply rendered native Talos config to one live node [node=required] [mode=try]
    prompt: Apply rendered Talos config to {{.node}} with mode={{.mode}}? This mutates the live node.
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      {{.TALOS_SCRIPTS_DIR}}/render-config.sh {{.node}} \
          | talosctl --nodes "${node_address}" apply-config --mode={{.mode}} -f /dev/stdin
    vars:
      mode: '{{.mode | default "try"}}'
    requires:
      vars: [node]
    preconditions:
      - talosctl config info >/dev/null 2>&1
      - talosctl --nodes $$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}}) get machineconfig >/dev/null 2>&1

  apply-insecure-node:
    desc: Apply rendered Talos config to one node in maintenance mode [node=required]
    prompt: Apply rendered Talos config insecurely to {{.node}}? Use only during bootstrap/replacement.
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      {{.TALOS_SCRIPTS_DIR}}/render-config.sh {{.node}} \
          | talosctl --nodes "${node_address}" apply-config --insecure -f /dev/stdin
    requires:
      vars: [node]
    preconditions:
      - which talosctl

  apply-insecure-all:
    desc: Apply rendered Talos configs insecurely to all nodes [confirm=bootstrap]
    cmds:
      - for: { var: TALOS_NODES, split: "," }
        task: apply-insecure-node
        vars:
          node: "{{.ITEM}}"
    requires:
      vars: [confirm]
    preconditions:
      - sh: test "{{.confirm}}" = "bootstrap"
        msg: Refusing insecure all-node apply unless confirm=bootstrap is set

  generate:
    desc: Validate all native Talos configs; native rendering writes no generated machine configs
    cmds:
      - task: validate-all

  upgrade:
    desc: Break-glass Talos upgrade on a single node using rendered installer image [node=name]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      talos_image="$({{.TALOS_SCRIPTS_DIR}}/machine-image.sh {{.node}})"
      bash {{.TALOS_SCRIPTS_DIR}}/upgrade.sh "${node_address}" "${talos_image}" "{{.rollout}}"
    vars:
      rollout: '{{.rollout | default "false"}}'
    requires:
      vars: [node]
    preconditions:
      - talosctl config info >/dev/null 2>&1
      - talosctl --nodes $$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}}) get machineconfig >/dev/null 2>&1

  upgrade-rollout:
    desc: Break-glass Talos rollout on supplied node names [nodes=comma-separated confirm=all-nodes]
    cmds:
      - kubectl get ns -o jsonpath='{.items[*].metadata.name}' | xargs -n1 -I {} flux suspend kustomization --all -n {}
      - kubectl cnpg maintenance set --reusePVC --all-namespaces
      - for: { var: nodes, split: "," }
        task: upgrade
        vars:
          node: "{{.ITEM}}"
          rollout: "true"
      - kubectl cnpg maintenance unset --reusePVC --all-namespaces
      - kubectl get ns -o jsonpath='{.items[*].metadata.name}' | xargs -n1 -I {} flux resume kustomization --all -n {}
      - task: :kubernetes:delete-failed-pods
    requires:
      vars: [nodes, confirm]
    preconditions:
      - sh: test "{{.confirm}}" = "all-nodes"
        msg: Refusing all-node Talos rollout unless confirm=all-nodes is set
      - talosctl config info >/dev/null 2>&1

  upgrade-k8s:
    desc: Upgrade k8s from a control-plane node [node=k8s-node-1] [to=required]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      talosctl --nodes "${node_address}" upgrade-k8s --to {{.to}}
    vars:
      node: '{{.node | default "k8s-node-1"}}'
    requires:
      vars: [to]
    preconditions:
      - talosctl --nodes $$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}}) get machineconfig >/dev/null 2>&1

  reboot-node:
    desc: Reboot Talos on a single node [node=required] [mode=powercycle]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      talosctl --nodes "${node_address}" reboot --mode={{.mode}}
    vars:
      mode: '{{.mode | default "powercycle"}}'
    requires:
      vars: [node]
    preconditions:
      - talosctl --nodes $$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}}) get machineconfig >/dev/null 2>&1
      - which talosctl

  fetch-kubeconfig:
    desc: Fetch kubeconfig from a Talos node [node=k8s-node-1]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      talosctl --nodes "${node_address}" kubeconfig --force
    vars:
      node: '{{.node | default "k8s-node-1"}}'
    preconditions:
      - talosctl config info >/dev/null 2>&1

  bootstrap:
    desc: Bootstrap etcd from a rendered control-plane node [node=k8s-node-1]
    cmd: |
      node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh {{.node}})"
      talosctl --nodes "${node_address}" bootstrap
    vars:
      node: '{{.node | default "k8s-node-1"}}'
    preconditions:
      - talosctl config info >/dev/null 2>&1

  nuke:
    desc: Reset all Talos nodes back to maintenance mode [confirm=destroy-cluster]
    prompt: This will DESTROY the cluster and reset all nodes to maintenance mode... continue?
    cmd: |
      IFS="," read -ra nodes <<< "{{.TALOS_NODES}}"
      for node in "${nodes[@]}"; do
          node_address="$({{.TALOS_SCRIPTS_DIR}}/node-address.sh "${node}")"
          talosctl --nodes "${node_address}" reset \
              --reboot \
              --system-labels-to-wipe STATE \
              --system-labels-to-wipe EPHEMERAL \
              --graceful=false \
              --wait=false
      done
    requires:
      vars: [confirm]
    preconditions:
      - sh: test "{{.confirm}}" = "destroy-cluster"
        msg: Refusing cluster reset unless confirm=destroy-cluster is set
      - talosctl config info >/dev/null 2>&1
