[env]
# Resolved at runtime by `op run`; avoids requiring a workstation-local age key file.
SOPS_AGE_KEY = "op://k8s/sops/SOPS_PRIVATE_KEY"

[tools]
# Kubernetes
kubectl = "1.37.1"
helm = "4.3.0"
helmfile = "1.8.0"
kustomize = "5.8.1"
flux2 = "2.9.5"

# Talos
talosctl = "1.14.1"
"github:mitsuhiko/minijinja" = "2.24.0"

# Secrets
sops = "3.13.3"
age = "1.3.2"
1password-cli = "2.32.1"

# Utilities
jq = "1.8.2"
yq = "4.53.6"
just = "1.58.0"
fzf = "0.74.4"
gh = "2.101.0"
