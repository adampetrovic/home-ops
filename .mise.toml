[env]
# Resolved at runtime by `op run`; avoids requiring a workstation-local age key file.
SOPS_AGE_KEY = "op://k8s/sops/SOPS_PRIVATE_KEY"

[tools]
# Kubernetes
kubectl = "1.37.2"
helm = "4.3.1"
helmfile = "1.8.2"
kustomize = "5.8.3"
flux2 = "2.10.0"
"aqua:cilium/hubble" = "1.20.2"

# Talos
talosctl = "1.14.5"
"github:mitsuhiko/minijinja" = "3.0.5"

# Secrets
sops = "3.13.3"
age = "1.3.2"
1password-cli = "2.32.1"

# Utilities
jq = "1.8.2"
yq = "4.54.1"
just = "1.59.0"
gh = "2.103.3"
