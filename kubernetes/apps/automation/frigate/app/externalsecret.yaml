---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: frigate-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FRIGATE_MQTT_USERNAME: "{{ .MQTT_USERNAME }}"
        FRIGATE_MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"

        PLUS_API_KEY: "{{ .FRIGATE_PLUS_API_KEY }}"

        FRIGATE_OPENAI_API_KEY: "{{ .FRIGATE_OPENAI_API_KEY }}"

        FRIGATE_LPR_SNOW_WHITE: "{{ .FRIGATE_LPR_SNOW_WHITE }}"
        FRIGATE_LPR_SILVER_SURFER: "{{ .FRIGATE_LPR_SILVER_SURFER }}"

  dataFrom:
    - extract:
        key: frigate
    - extract:
        key: mosquitto
      rewrite:
        - regexp:
            source: "(.*)"
            target: "MQTT_$1"
