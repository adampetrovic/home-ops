---
groups:
  - name: fernwood
    rules:
      - alert: FernwoodError
        expr: |
          sum by (app) (count_over_time({app="fernwood"} |~ "(?i)errors"[1h])) > 0
        for: 2m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "{{ $labels.app }}"
          summary: "{{ $labels.app }} is experiencing errors"
