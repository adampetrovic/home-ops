---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fernwood
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: fernwood-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_SECRET_KEY: "{{ .APP_SECRET_KEY }}"
        VAPID_PUBLIC_KEY: "{{ .VAPID_PUBLIC_KEY }}"
        VAPID_PRIVATE_KEY: "{{ .VAPID_PRIVATE_KEY }}"
        ALLOWED_EMAILS: "{{ .SUE_AUTOBOOK_USERNAME }},{{ .ERIKA_AUTOBOOK_USERNAME }}"
        # Weekly classes carried over from the fernwood-booker configs. Each
        # member's classes attach to them on first login, matched by email.
        bootstrap.yaml: |
          users:
            - email: "{{ .SUE_AUTOBOOK_USERNAME }}"
              classes:
                - {name: Reformer Pilates, day: Monday, start_time: "17:00"}
                - {name: Reformer Pilates, day: Tuesday, start_time: "07:00"}
                - {name: Reformer Pilates, day: Wednesday, start_time: "07:30"}
                - {name: Reformer Pilates, day: Saturday, start_time: "07:30"}
            - email: "{{ .ERIKA_AUTOBOOK_USERNAME }}"
              classes:
                - {name: Reformer Pilates, day: Monday, start_time: "17:00"}
                - {name: Reformer Pilates, day: Tuesday, start_time: "07:00"}
                - {name: Reformer Pilates, day: Wednesday, start_time: "07:30"}
                - {name: Reformer Pilates, day: Thursday, start_time: "07:15"}
                - {name: Reformer Pilates, day: Saturday, start_time: "07:30"}
  dataFrom:
    - extract:
        key: fernwood
    - extract:
        key: fernwood-booker-sue
      rewrite:
        - regexp:
            source: "(.*)"
            target: "SUE_$1"
    - extract:
        key: fernwood-booker-erika
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ERIKA_$1"
