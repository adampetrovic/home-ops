---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: &namespace automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repositories
      namespace: kopiur-system
    - name: external-secrets-stores
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: mosquitto
      namespace: automation
  path: ./kubernetes/apps/automation/zigbee2mqtt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_SOURCE_PVC: *app
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
