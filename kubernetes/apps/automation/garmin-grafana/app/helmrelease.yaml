---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garmin-grafana
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      garmin-grafana:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/arpanghosh8453/garmin-fetch-data
              tag: latest@sha256:3282b5144f23a8b9e96e4593a03f50914add28c5d837e4ef529781d45ee7cba7
            env:
              TZ: "${TZ}"
              INFLUXDB_VERSION: "1"
              INFLUXDB_HOST: influxdb.observability.svc.cluster.local
              INFLUXDB_PORT: "8086"
              INFLUXDB_DATABASE: GarminStats
              INFLUXDB_ENDPOINT_IS_HTTP: "true"
              TOKEN_DIR: /home/appuser/.garminconnect
              USER_TIMEZONE: Australia/Sydney
              UPDATE_INTERVAL_SECONDS: "300"
              FORCE_REPROCESS_ACTIVITIES: "false"
              TAG_MEASUREMENTS_WITH_USER_EMAIL: "false"
              REQUEST_INTRADAY_DATA_REFRESH: "false"
            envFrom:
              - secretRef:
                  name: garmin-grafana-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    persistence:
      tokens:
        enabled: true
        existingClaim: *app
        advancedMounts:
          garmin-grafana:
            app:
              - path: /home/appuser/.garminconnect
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
