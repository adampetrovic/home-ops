---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GH_DEPLOY_KEY: |
          {{ .GITHUB_PRIVATE_KEY }}

        KNOWN_HOSTS: |
          {{ .GITHUB_KNOWN_HOSTS }}

        GIT_CONFIG: |
          {{ .GIT_CONFIG }}

        HASS_POSTGRES_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-rw.database.svc.cluster.local/homeassistant"
        HASS_INFLUXDB_TOKEN: "{{ .HASS_INFLUXDB_TOKEN }}"
        HASS_INFLUXDB_ORGID: "{{ .HASS_INFLUXDB_ORGID }}"
        HASS_PROTECT_API_KEY: "{{ .HASS_PROTECT_API_KEY }}"
  dataFrom:
    - extract:
        key: github
    - extract:
        key: homeassistant
    - extract:
        key: cluster-secrets
