---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      homeassistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.1@sha256:c129b1e4190273254d93d413fe2a083233c9202d84cb08f84dddb01861df432e
            env:
              TZ: "Australia/Sydney"
              POSTGRES_HOST: postgres-rw.database.svc.cluster.local
              POSTGRES_DB: homeassistant
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 95m
                memory: 1536Mi
              limits:
                memory: 3Gi
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-trusted",
                "namespace": "network",
                "ips": ["10.0.10.99/23"],
                "mac": "9a:d4:f2:54:5a:97"
              }]
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: *app
        controller: homeassistant
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: hass-direct.petrovic.network
          lbipam.cilium.io/ips: 10.0.88.4
        ports:
          http:
            enabled: true
            port: 8123
          homekit:
            enabled: true
            protocol: TCP
            port: 21065

    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "hass.petrovic.network"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
      external:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "hass.${SECRET_PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

    persistence:
      config:
        enabled: true
        existingClaim: home-assistant

      deps:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /config/deps

      venv:
        type: emptyDir
        globalMounts:
          - path: /config/.venv

      uv-cache:
        type: emptyDir
        globalMounts:
          - path: /config/.cache/uv
