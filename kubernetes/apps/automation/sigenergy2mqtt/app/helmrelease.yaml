---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sigenergy2mqtt
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      sigenergy2mqtt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/seud0nym/sigenergy2mqtt
              tag: 2026.11.11@sha256:c2d6c3a5ef844fc284d40a6d8b88e35cc7cbf388b617a22fbdf765ba8de1c4b3
            env:
              TZ: "Australia/Sydney"

              SIGENERGY2MQTT_MODBUS_HOST: "10.0.21.71"
              SIGENERGY2MQTT_MODBUS_PORT: "502"
              SIGENERGY2MQTT_MODBUS_INVERTER_DEVICE_ID: "1"

              SIGENERGY2MQTT_MQTT_BROKER: "mosquitto.automation.svc.cluster.local"
              SIGENERGY2MQTT_MQTT_PORT: "1883"

              SIGENERGY2MQTT_HASS_ENABLED: "true"
              SIGENERGY2MQTT_HASS_CHILD_DEVICES: "true"
              SIGENERGY2MQTT_HASS_ENTITY_ID_PREFIX: "sigen"
              SIGENERGY2MQTT_HASS_UNIQUE_ID_PREFIX: "sigen"

              SIGENERGY2MQTT_INFLUX_ENABLED: "true"
              SIGENERGY2MQTT_INFLUX_HOST: "influxdb.observability.svc.cluster.local"
              SIGENERGY2MQTT_INFLUX_PORT: "8086"
              SIGENERGY2MQTT_INFLUX_BUCKET: "sigenergy"

              SIGENERGY2MQTT_PVOUTPUT_ENABLED: "true"
              SIGENERGY2MQTT_PVOUTPUT_CONSUMPTION: "true"
              SIGENERGY2MQTT_PVOUTPUT_EXPORTS: "true"
              SIGENERGY2MQTT_PVOUTPUT_IMPORTS: "true"
              SIGENERGY2MQTT_PVOUTPUT_OUTPUT_HOUR: "23"
              SIGENERGY2MQTT_PVOUTPUT_VOLTAGE: "l/n-avg"
              SIGENERGY2MQTT_PVOUTPUT_LOG_LEVEL: "INFO"
              # CovaU SolarMax tariff windows from 2026-11-09.
              # Maps rates to sigenergy2mqtt's 4 tariff types:
              #   off-peak      = Free        ($0.00 for the first 50 kWh/day, 11:00-14:00)
              #   shoulder      = EV Off-Peak ($0.165, 00:00-06:00)
              #   high-shoulder = Off-Peak    ($0.2802)
              #   peak          = Peak        ($0.6139, 15:00-21:00, all year)
              # NOTE: These windows must match your PVOutput Tariff Windows configuration.
              SIGENERGY2MQTT_PVOUTPUT_PERIODS_JSON: >-
                [{"plan":"CovaU SolarMax","from-date":"2026-11-09","default":"high-shoulder","periods":[{"type":"shoulder","start":"00:00","end":"06:00"},{"type":"high-shoulder","start":"06:00","end":"11:00"},{"type":"off-peak","start":"11:00","end":"14:00"},{"type":"high-shoulder","start":"14:00","end":"15:00"},{"type":"peak","start":"15:00","end":"21:00"},{"type":"high-shoulder","start":"21:00","end":"24:00"}]}]

              SIGENERGY2MQTT_LOG_LEVEL: "INFO"

            envFrom:
              - secretRef:
                  name: sigenergy2mqtt-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

    persistence:
      data:
        existingClaim: sigenergy2mqtt
        globalMounts:
          - path: /data
