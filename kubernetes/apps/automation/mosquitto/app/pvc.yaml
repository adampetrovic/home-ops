---
# CephFS, not RBD, so the singleton broker remounts on another node without detach delays.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-cephfs
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    meta.helm.sh/release-name: mosquitto
    meta.helm.sh/release-namespace: automation
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 1Gi
