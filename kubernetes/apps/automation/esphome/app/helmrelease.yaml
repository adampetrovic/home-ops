---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      esphome:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.10.0@sha256:27a7296378ceca11e7f0db575c98f1a5af58dc2e618da849909850ba7e6d7c00
            env:
              ESPHOME_DASHBOARD_USE_PING: true
            resources:
              requests:
                cpu: 407m
                memory: 2Gi
              limits:
                memory: 6Gi
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1-39@sha256:394f5b0958e3e15692351c16cc76bf400fb8daf0e48c2926bfef3a46823abb34
            env:
              TZ: "${TZ}"
              GIT_AUTHOR_NAME: "Adam Petrovic"
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - /config
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-trusted",
                "namespace": "network",
                "ips": ["10.0.10.101/23"],
                "mac": "9a:d4:f2:54:5a:98"
              }]
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: esphome
        ports:
          http:
            port: 6052
      codeserver:
        controller: esphome
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - esphome.petrovic.network
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
      codeserver:
        hostnames:
          - "esphome-code.petrovic.network"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http
    persistence:
      config:
        enabled: true
        existingClaim: esphome
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache
