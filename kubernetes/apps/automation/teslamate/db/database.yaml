---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: teslamate
spec:
  cluster:
    name: postgres
  name: teslamate
  owner: teslamate
  ensure: present
  databaseReclaimPolicy: retain
  extensions:
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
