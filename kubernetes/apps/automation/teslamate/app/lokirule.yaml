---
groups:
  - name: teslamate
    rules:
      - alert: TeslaMateExpiredTokens
        expr: |
          sum(count_over_time({app="teslamate"} |~ "(?i)Error / not_signed_in"[5m])) > 0
        for: 1m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "{{ $labels.app }}"
          summary: "{{ $labels.app }} has expired tokens. Sign in with new tokens from Tesla Auth app."

      - alert: TeslaMateApiErrorStorm
        expr: |
          sum by (app) (count_over_time({app="teslamate"} | json | container_name="app" |~ `-> (4\d\d|5\d\d)` [10m])) > 10
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          app: "{{ $labels.app }}"
          summary: "TeslaMate Tesla API error storm"
          description: >-
            More than 10 failed Tesla API responses (4xx/5xx, e.g. 403 forbidden,
            408 vehicle-unavailable, 503) from teslamate in 10m, sustained 5m.
            Normal is ~0. Check Loki for the status codes; sustained 408s correlate
            with stale-asleep / missed drives, a 403 burst means an auth problem.

      # Match the API error line, not [error]: TeslaMate logs [error] during CNPG switchovers.
      - alert: TeslaMateErrorLogs
        expr: |
          sum by (app) (count_over_time({app="teslamate"} | json | container_name="app" |~ `TeslaApi\.Error` [10m])) > 5
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          app: "{{ $labels.app }}"
          summary: "TeslaMate is seeing Tesla API/car connectivity errors"
          description: >-
            More than 5 TeslaApi.Error lines from the teslamate container in 10m,
            sustained 5m. This intentionally ignores transient internal errors
            such as database reconnects during CNPG rollouts; check `kubectl -n
            automation logs deploy/teslamate -c app` for Tesla API timeout/auth details.
