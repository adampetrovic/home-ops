---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: healthng
spec:
  description: >-
    HealthNG's admin listener trusts Authelia's identity headers, so only the
    external gateway may reach it, and it may send mail through the SMTP relay.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: healthng
      app.kubernetes.io/controller: healthng
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
            app.kubernetes.io/controller: smtp-relay
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
