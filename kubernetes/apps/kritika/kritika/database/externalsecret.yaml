---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika
        password: "{{ .POSTGRES_OWNER_PASS }}"
        uri: >-
          postgres://kritika:{{ .POSTGRES_OWNER_PASS }}@kritika-postgres-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: POSTGRES_OWNER_PASS
      remoteRef:
        key: kritika
        property: POSTGRES_OWNER_PASS
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika_app
        password: "{{ .POSTGRES_APP_PASS }}"
        uri: >-
          postgres://kritika_app:{{ .POSTGRES_APP_PASS }}@kritika-postgres-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  data:
    - secretKey: POSTGRES_APP_PASS
      remoteRef:
        key: kritika
        property: POSTGRES_APP_PASS
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: aws-access-key-id
      remoteRef:
        key: cloudnative-pg
        property: AWS_ACCESS_KEY_ID
    - secretKey: aws-secret-access-key
      remoteRef:
        key: cloudnative-pg
        property: AWS_SECRET_ACCESS_KEY
