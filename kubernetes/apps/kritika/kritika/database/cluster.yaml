---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  # Bump the vchord version in database.yaml alongside this image
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  # Kritika refuses an owner that is a superuser
  enableSuperuserAccess: false
  postgresql:
    parameters:
      wal_compression: lz4
      # Each forced WAL switch writes a full 16MiB segment; the CNPG default is 5min.
      archive_timeout: 30min
    shared_preload_libraries:
      - "vchord.so"
  # No backup exists yet, so the first creation uses initdb. Switch to
  # bootstrap.recovery, with the skipEmptyWalArchiveCheck annotation, once the
  # first backup completes.
  bootstrap:
    initdb:
      database: kritika
      owner: kritika
      secret:
        name: kritika-postgres-owner
  # Draining the primary's node switches over to a replica first
  enablePDB: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-garage
        serverName: kritika-postgres
