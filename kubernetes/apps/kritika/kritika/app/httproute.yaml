---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - "kritika.petrovic.network"
  rules:
    - backendRefs:
        - name: kritika
          port: 8080
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika-webhook
spec:
  # GitHub delivers webhooks here. Only the webhook path is public; the
  # dashboard stays on the internal gateway.
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - "kritika.${SECRET_PUBLIC_DOMAIN}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /hooks/github
          method: POST
      backendRefs:
        - name: kritika
          port: 8080
