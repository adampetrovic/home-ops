---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kritika
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    podLabels:
      policy.petrovic.network/public-app: "true"
    database:
      owner:
        existingSecret: kritika-postgres-owner
      app:
        existingSecret: kritika-postgres-app
    envFrom:
      - secretRef:
          name: kritika-secret
    networkPolicy:
      type: cilium
      egressPorts: []
      postgres:
        podSelector:
          cnpg.io/cluster: kritika-postgres
    runner:
      podTemplate:
        spec:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            app.kubernetes.io/name: grafana
    config:
      webUrl: https://kritika.petrovic.network
      auth:
        oidc:
          name: Authelia
          issuer: https://auth.${SECRET_PUBLIC_DOMAIN}
          clientId: kritika
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, profile, email, groups]
          rolesClaim: groups
          roleMappingExpr: '"admin" in roles ? "admin" : ""'
      apps:
        github:
          accounts: [adampetrovic]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        anthropic:
          type: anthropic
          apiKey: { env: ANTHROPIC_API_KEY }
          pricing:
            claude-sonnet-5-5: { input: 2, output: 10, cacheRead: 0.1, cacheWrite: 2.5 }
            claude-haiku-5-5: { input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125 }
        openai:
          type: openai
          apiKey: { env: OPENAI_API_KEY }
          pricing:
            text-embedding-3-small: { input: 0.02 }
      embedding:
        model: openai/text-embedding-3-small
        dims: 1536
      egress:
        allow:
          - release-assets.githubusercontent.com
          - ghcr.io
          - pkg-containers.githubusercontent.com
          - mirror.gcr.io
      review:
        model: anthropic/claude-sonnet-5-5
        approve:
          when:
            - name: renovate-updates
              expr: >-
                pr.author.startsWith("bot-adam") && pr.labels.exists(l, l.name in
                ["type/patch", "type/minor", "type/digest", "renovate/grafana-dashboard"])
      confidence:
        model: anthropic/claude-haiku-5-5
        threshold: 5
        risk: low
        gate:
          when:
            - name: renovate
              expr: pr.headRef.startsWith("renovate/")
        instructions: >-
          The workflows under .github/workflows validate, label and run Renovate.
          They deploy nothing, so rate updates to the actions they use as
          standalone. A Grafana dashboard revision is a numbered re-export of one
          dashboard, not a major version: rate it by what the dashboard serves.
        floors:
          high:
            - talos/**
            - bootstrap/**
            - kubernetes/flux/**
            - kubernetes/apps/flux-system/**
            - kubernetes/apps/kube-system/cilium/**
            - kubernetes/apps/kube-system/coredns/**
            - kubernetes/apps/network/envoy-gateway/**
            - kubernetes/apps/network/multus/**
            - kubernetes/apps/external-secrets/**
            - kubernetes/apps/cert-manager/**
            - kubernetes/apps/security/**
            - kubernetes/apps/rook-ceph/**
            - kubernetes/apps/openebs-system/**
            - kubernetes/apps/kopiur-system/**
            - kubernetes/apps/system-upgrade/**
            - kubernetes/apps/database/cloudnative-pg/**
            - kubernetes/apps/**/database/cluster.yaml
            - kubernetes/apps/kritika/**
      comments:
        dashboard: false
      trigger:
        limit: 5
        include:
          - name: trusted-authors
            expr: pr.author == "adampetrovic" || pr.author.startsWith("bot-adam")
        exclude:
          - { name: forks, expr: pr.fork }
          - { name: drafts, expr: pr.draft }
          - { name: skip-label, expr: 'pr.labels.exists(l, l.name == "skip-review")' }
      agent:
        tokens: 1000000
      limits:
        reviewsPerDay: 100
        tokensPerMonth: 50000000
