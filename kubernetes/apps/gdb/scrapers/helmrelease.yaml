---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-scrapers
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWaitForJobs: true
    remediation:
      retries: -1
  upgrade:
    # Observe batch Job health directly; retained failed Jobs stall Helm's waiter.
    disableWait: true
    disableWaitForJobs: true
    cleanupOnFail: false
    remediation:
      retries: 0
      remediateLastFailure: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      worker:
        enabled: false
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.98@sha256:f5041cc5db503a9a78c3983f35ccd8dea92a62c4e45e1bc2ea96d7b2a4cb5169
            command: [python, -m, scraper.jobs.worker]
            envFrom:
              - secretRef:
                  name: gdb-secret
            env:
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MMS_CACHE_DIR: /app/output/mms-cache
              PYTHONDONTWRITEBYTECODE: "1"
              LOG_LEVEL: INFO
              JOB_WORKER_ID:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              JOB_IMAGE: ghcr.io/adampetrovic/gdb-scraper:0.1.98
              JOB_IMAGE_DIGEST: sha256:f5041cc5db503a9a78c3983f35ccd8dea92a62c4e45e1bc2ea96d7b2a4cb5169
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
      usag:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 0"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app: &scraper-container
            image:
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.97@sha256:5bb3b00d034dce369e7cdc04cab98f13f4005a154eb98c14099fea43a0f4dce2
            args: [usag]
            env:
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
              CONCURRENCY: "50"
            envFrom: &envFrom
              - secretRef:
                  name: gdb-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
      usag-incremental:
        type: cronjob
        cronjob:
          schedule: "0 0 31 2 *"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 604800
          backoffLimit: 0
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [usag]
            env:
              MODE: incremental
              # Omit START_ID/MAX_ID: start at MAX(people.id) + 1 and stop at
              # the incremental miss threshold, rather than rescanning from zero.
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
              CONCURRENCY: "50"
      mso-fetch-bootstrap:
        type: cronjob
        cronjob:
          schedule: "0 0 31 2 *"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            env:
              # Omitted SEASONS discovers historical seasons and MSO's active season.
              MODE: full
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_CACHE_MODE: fetch-cache
              CONCURRENT_REQUESTS: "10"
              CONCURRENT_REQUESTS_PER_DOMAIN: "10"
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
              LOG_LEVEL: INFO
      mso-import-bootstrap: &mso-import-job
        type: job
        job:
          backoffLimit: 0
        pod:
          automountServiceAccountToken: false
        initContainers:
          validate-cache:
            image: &mso-import-image
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.98@sha256:f5041cc5db503a9a78c3983f35ccd8dea92a62c4e45e1bc2ea96d7b2a4cb5169
            command: [sh, -ec]
            args:
              - |
                manifest="$(ls -1t /app/output/mso-cache/manifests/*-fetch.json | head -n 1)"
                test -n "$manifest"
                cp "$manifest" /tmp/mso-import-fetch.json
                python -m scraper.validate_mso_cache --manifest /tmp/mso-import-fetch.json
            env:
              PYTHONDONTWRITEBYTECODE: "1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            <<: *scraper-container
            image: *mso-import-image
            command: [python, -m, scraper.replay_mso_cache_fast]
            args: [--cache-dir, /app/output/mso-cache, --mode, full]
            envFrom: *envFrom
            env:
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_REPLAY_MANIFEST: /tmp/mso-import-fetch.json
              MSO_CACHE_RUN_ID: mso-import-bootstrap
              MSO_OFFLINE_REPLAY: "true"
              GDB_DISABLE_NETWORK_FETCHES: "true"
              PYTHONDONTWRITEBYTECODE: "1"
              LOG_LEVEL: INFO
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
      mso-import-bootstrap-v2:
        <<: *mso-import-job
        initContainers:
          validate-cache:
            image: *mso-import-image
            command: [python, -c]
            args:
              - |
                from pathlib import Path
                from shutil import copyfile
                from scraper.jobs.artifacts import contained, response_paths, validate_response, validated
                from scraper.spiders.meetscoresonline import MeetScoresOnlineSpider
                spider = MeetScoresOnlineSpider(mode="full", cache_mode="replay-cache", output_dir="/app/output")
                catalog = spider._load_season_catalog()
                path = spider._latest_fetch_manifest_path(catalog["seasons"])
                if path is None:
                    raise RuntimeError("No complete fetch manifest covers the full cached season catalog")
                manifest = validated(path)
                if manifest["mode"] != "full":
                    raise RuntimeError("Full bootstrap import requires a full fetch manifest")
                responses = response_paths(manifest)
                for relative in responses:
                    validate_response(contained(Path("/app/output/mso-cache"), relative))
                copyfile(path, "/tmp/mso-import-fetch.json")
                print("Cache preflight passed: seasons=%s responses=%s" % (len(manifest["seasons"]), len(responses)))
            env:
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_OFFLINE_REPLAY: "true"
              GDB_DISABLE_NETWORK_FETCHES: "true"
              PYTHONDONTWRITEBYTECODE: "1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            <<: *scraper-container
            image: *mso-import-image
            command: [sh, -ec]
            args:
              - |
                python -m scraper.replay_mso_cache_fast --cache-dir /app/output/mso-cache --mode full
                python -c 'from pathlib import Path; from scraper.jobs.artifacts import validate_replay, validated; validate_replay(Path("/app/output/mso-cache/manifests/mso-import-bootstrap-v2-replay.json"), validated(Path("/tmp/mso-import-fetch.json")))'
            envFrom: *envFrom
            env:
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_REPLAY_MANIFEST: /tmp/mso-import-fetch.json
              MSO_CACHE_RUN_ID: mso-import-bootstrap-v2
              MSO_OFFLINE_REPLAY: "true"
              GDB_DISABLE_NETWORK_FETCHES: "true"
              PYTHONDONTWRITEBYTECODE: "1"
              LOG_LEVEL: INFO
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
      mso:
        type: cronjob
        cronjob:
          schedule: "0 18 * * 3"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            envFrom: *envFrom
            env:
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
      mms-fetch-bootstrap:
        type: cronjob
        cronjob:
          schedule: "0 0 31 2 *"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mms]
            env:
              MODE: full
              YEARS: "2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026"
              OUTPUT_DIR: /app/output
              MMS_CACHE_DIR: /app/output/mms-cache
              MMS_CACHE_MODE: fetch-cache
              CONCURRENT_REQUESTS: "10"
              CONCURRENT_REQUESTS_PER_DOMAIN: "10"
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
              LOG_LEVEL: INFO
      mms:
        type: cronjob
        cronjob:
          schedule: "0 6 * * 1"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mms]
            envFrom: *envFrom
            env:
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
    persistence:
      output:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: ceph-block
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
