---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-scrapers
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      usag:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 0"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app: &scraper-container
            image:
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.96@sha256:5fe93c78fd33166221499ca4e9d375eeca892d0af304697d7a0791965acc1d38
            args: [usag]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
              CONCURRENCY: "50"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
      mso-fetch-bootstrap:
        type: job
        job:
          backoffLimit: 1
          ttlSecondsAfterFinished: 604800
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            env:
              MODE: full
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_CACHE_MODE: fetch-cache
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
              LOG_LEVEL: INFO
      mso:
        type: cronjob
        cronjob:
          schedule: "0 18 * * 3"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
      mms:
        type: cronjob
        cronjob:
          schedule: "0 6 * * 1"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mms]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
    persistence:
      output:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: ceph-block
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
