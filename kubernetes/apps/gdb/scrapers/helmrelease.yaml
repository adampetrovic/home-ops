---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-scrapers
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWaitForJobs: true
    remediation:
      retries: -1
  upgrade:
    # Historical bootstrap can run well beyond Helm's reconciliation timeout.
    disableWaitForJobs: true
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      usag:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 0"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app: &scraper-container
            image:
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.97@sha256:5bb3b00d034dce369e7cdc04cab98f13f4005a154eb98c14099fea43a0f4dce2
            args: [usag]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
              CONCURRENCY: "50"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
      usag-incremental:
        type: job
        job:
          suspend: true
          # Do not repeat the scan automatically if post-run validation fails.
          backoffLimit: 0
          ttlSecondsAfterFinished: 604800
        containers:
          app:
            <<: *scraper-container
            args: [usag]
            env:
              MODE: incremental
              # Omit START_ID/MAX_ID: start at MAX(people.id) + 1 and stop at
              # the incremental miss threshold, rather than rescanning from zero.
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
              CONCURRENCY: "50"
      mso-fetch-bootstrap:
        type: job
        job:
          backoffLimit: 1
          ttlSecondsAfterFinished: 604800
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            env:
              # Omitted SEASONS discovers historical seasons and MSO's active season.
              MODE: full
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MSO_CACHE_MODE: fetch-cache
              CONCURRENT_REQUESTS: "10"
              CONCURRENT_REQUESTS_PER_DOMAIN: "10"
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
              LOG_LEVEL: INFO
      mso:
        type: cronjob
        cronjob:
          schedule: "0 18 * * 3"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mso]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
      mms-fetch-bootstrap:
        type: job
        job:
          # Keep dormant until the historical fetch is explicitly approved.
          suspend: true
          backoffLimit: 1
          ttlSecondsAfterFinished: 604800
        containers:
          app:
            <<: *scraper-container
            args: [mms]
            env:
              MODE: full
              YEARS: "2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026"
              OUTPUT_DIR: /app/output
              MMS_CACHE_DIR: /app/output/mms-cache
              MMS_CACHE_MODE: fetch-cache
              CONCURRENT_REQUESTS: "10"
              CONCURRENT_REQUESTS_PER_DOMAIN: "10"
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
              LOG_LEVEL: INFO
      mms:
        type: cronjob
        cronjob:
          schedule: "0 6 * * 1"
          timeZone: Australia/Sydney
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
          backoffLimit: 1
          suspend: true
        containers:
          app:
            <<: *scraper-container
            args: [mms]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: DATABASE_URL
              MODE: incremental
              OUTPUT_DIR: /app/output
              LOG_LEVEL: INFO
    persistence:
      output:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: ceph-block
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
