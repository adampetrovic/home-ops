---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-scraper
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  interval: 30m
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 100
    controllers:
      usag-bootstrap:
        type: cronjob
        cronjob: &manualCronJob
          schedule: "0 0 1 1 *"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 0
        pod: &scraperPod
          restartPolicy: Never
        containers:
          scraper:
            image: &image
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.83@sha256:33c11ce1547820692c1617c4d50c45274b9d13abd327b17c48a124586458d94b
            env:
              DATABASE_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: gdb-runtime-secret
                    key: DATABASE_URL
              OUTPUT_DIR: /export
              SOURCE: usag
              MODE: full
              CONCURRENCY: "50"
            probes: &disabledProbes
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      mso-canary-fetch:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export/canary/mso
              SOURCE: mso
              MODE: incremental
              MSO_CACHE_MODE: fetch-cache
              MSO_CACHE_DIR: /export/canary/mso/mso-cache
              MSO_LOOKUP_CLUBS: "true"
              LIMIT_MEETS: "1"
              CONCURRENT_REQUESTS: "1"
              CONCURRENT_REQUESTS_PER_DOMAIN: "1"
              RETRY_TIMES: "0"
              http_proxy: &externalProxy
                valueFrom:
                  secretKeyRef:
                    name: gdb-scraper-proxy-secret
                    key: EXTERNAL_PROXY_URL
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext: *containerSecurity
      mso-bootstrap-fetch:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export
              SOURCE: mso
              MODE: full
              SEASONS: &msoBootstrapSeasons "2026-2027,2025-2026,2024-2025,2023-2024,2022-2023,2021-2022,2020-2021,2019-2020,2018-2019,2017-2018,2016-2017,2015-2016,2014-2015,2013-2014,2012-2013,2011-2012,2010-2011,2009-2010,2008-2009,2007-2008,2006-2007,2005-2006,2004-2005,2003-2004,2002-2003,2001-2002,2000-2001"
              MSO_CACHE_MODE: fetch-cache
              MSO_CACHE_DIR: /export/mso-cache
              MSO_LOOKUP_CLUBS: "true"
              CONCURRENT_REQUESTS: "5"
              CONCURRENT_REQUESTS_PER_DOMAIN: "5"
              http_proxy: *externalProxy
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mso-bootstrap-replay:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            command:
              - /bin/bash
              - -lc
            args: &guardedReplay
              - |-
                set -euo pipefail
                min_rows="${USAG_BOOTSTRAP_MIN_RAINBOW_ROWS:-1000000}"
                rainbow_rows="$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM usagnum_hash_lookup" | tr -d '[:space:]')"
                if [ "${rainbow_rows:-0}" -lt "$min_rows" ]; then
                  echo "USAG bootstrap preflight failed: rainbow table has ${rainbow_rows:-0} rows; need at least ${min_rows}."
                  exit 1
                fi
                exec /app/entrypoint.sh "$SOURCE"
            env:
              DATABASE_URL: *databaseUrl
              OUTPUT_DIR: /export
              SOURCE: mso
              MODE: full
              SEASONS: *msoBootstrapSeasons
              MSO_CACHE_MODE: replay-cache
              MSO_CACHE_DIR: /export/mso-cache
              MSO_LOOKUP_CLUBS: "true"
              GDB_DISABLE_NETWORK_FETCHES: "true"
              MSO_OFFLINE_REPLAY: "true"
              USAG_BOOTSTRAP_MIN_RAINBOW_ROWS: "1000000"
            probes: *disabledProbes
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext: *containerSecurity
      mms-canary-fetch:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export/canary/mms
              SOURCE: mms
              MODE: incremental
              MMS_CACHE_MODE: fetch-cache
              MMS_CACHE_DIR: /export/canary/mms/mms-cache
              LIMIT_MEETS: "1"
              CONCURRENT_REQUESTS: "1"
              CONCURRENT_REQUESTS_PER_DOMAIN: "1"
              RETRY_TIMES: "0"
              http_proxy: *externalProxy
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext: *containerSecurity
      mms-bootstrap-fetch:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export
              SOURCE: mms
              MODE: full
              YEARS: &mmsBootstrapYears "2026,2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000"
              MMS_CACHE_MODE: fetch-cache
              MMS_CACHE_DIR: /export/mms-cache
              CONCURRENT_REQUESTS: "5"
              CONCURRENT_REQUESTS_PER_DOMAIN: "5"
              http_proxy: *externalProxy
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mms-bootstrap-replay:
        type: cronjob
        cronjob: *manualCronJob
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            command:
              - /bin/bash
              - -lc
            args: *guardedReplay
            env:
              DATABASE_URL: *databaseUrl
              OUTPUT_DIR: /export
              SOURCE: mms
              MODE: full
              YEARS: *mmsBootstrapYears
              MMS_CACHE_MODE: replay-cache
              MMS_CACHE_DIR: /export/mms-cache
              GDB_DISABLE_NETWORK_FETCHES: "true"
              MMS_OFFLINE_REPLAY: "true"
              USAG_BOOTSTRAP_MIN_RAINBOW_ROWS: "1000000"
            probes: *disabledProbes
            resources:
              requests:
                cpu: 500m
                memory: 12Gi
              limits:
                memory: 24Gi
            securityContext: *containerSecurity
      usag:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 0"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              DATABASE_URL: *databaseUrl
              OUTPUT_DIR: /export
              SOURCE: usag
              MODE: incremental
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mso-fetch-cache:
        type: cronjob
        cronjob:
          schedule: "0 18 * * 3"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export
              SOURCE: mso
              MODE: incremental
              MSO_CACHE_MODE: fetch-cache
              MSO_CACHE_DIR: /export/mso-cache
              MSO_LOOKUP_CLUBS: "true"
              CONCURRENT_REQUESTS: "5"
              CONCURRENT_REQUESTS_PER_DOMAIN: "5"
              http_proxy: *externalProxy
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mso-replay-cache:
        type: cronjob
        cronjob:
          schedule: "0 0 * * 4"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            command:
              - /bin/bash
              - -lc
            args: *guardedReplay
            env:
              DATABASE_URL: *databaseUrl
              OUTPUT_DIR: /export
              SOURCE: mso
              MODE: incremental
              MSO_CACHE_MODE: replay-cache
              MSO_CACHE_DIR: /export/mso-cache
              MSO_LOOKUP_CLUBS: "true"
              GDB_DISABLE_NETWORK_FETCHES: "true"
              MSO_OFFLINE_REPLAY: "true"
              USAG_BOOTSTRAP_MIN_RAINBOW_ROWS: "1000000"
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mms-fetch-cache:
        type: cronjob
        cronjob:
          schedule: "0 6 * * 1"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            env:
              OUTPUT_DIR: /export
              SOURCE: mms
              MODE: incremental
              MMS_CACHE_MODE: fetch-cache
              MMS_CACHE_DIR: /export/mms-cache
              CONCURRENT_REQUESTS: "5"
              CONCURRENT_REQUESTS_PER_DOMAIN: "5"
              http_proxy: *externalProxy
              https_proxy: *externalProxy
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
      mms-replay-cache:
        type: cronjob
        cronjob:
          schedule: "0 12 * * 1"
          timeZone: Australia/Sydney
          suspend: true
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
        pod: *scraperPod
        containers:
          scraper:
            image: *image
            command:
              - /bin/bash
              - -lc
            args: *guardedReplay
            env:
              DATABASE_URL: *databaseUrl
              OUTPUT_DIR: /export
              SOURCE: mms
              MODE: incremental
              MMS_CACHE_MODE: replay-cache
              MMS_CACHE_DIR: /export/mms-cache
              GDB_DISABLE_NETWORK_FETCHES: "true"
              MMS_OFFLINE_REPLAY: "true"
              USAG_BOOTSTRAP_MIN_RAINBOW_ROWS: "1000000"
            probes: *disabledProbes
            resources:
              requests:
                cpu: 250m
                memory: 3Gi
              limits:
                memory: 4Gi
            securityContext: *containerSecurity
    persistence:
      export:
        existingClaim: gdb-scraper
        globalMounts:
          - path: /export
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
