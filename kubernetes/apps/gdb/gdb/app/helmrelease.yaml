---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gdb
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  interval: 30m
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      gdb:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-web
              tag: 1.10.60@sha256:d44a00f501972a2a3caf7928d07d529c3c71afba103122814f8d0897343b67c8
              pullPolicy: IfNotPresent
            env:
              APP_ENV: production
              CACHE_TTL: 30m
              CORS_ORIGINS: https://gdb.${SECRET_DOMAIN}
              LOG_LEVEL: info
              RATE_LIMIT_PER_MIN: "600"
              SERVER_HOST: 0.0.0.0
              SERVER_PORT: "8080"
              SERVER_READ_TIMEOUT: 60s
              SERVER_WRITE_TIMEOUT: 60s
              STASH_HOST: ""
            envFrom:
              - secretRef:
                  name: gdb-runtime-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: gdb
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - gdb.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
