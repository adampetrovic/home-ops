---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gdb-web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gdb-web
      app.kubernetes.io/instance: gdb-web
  podTargetLabels: [app.kubernetes.io/name]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
