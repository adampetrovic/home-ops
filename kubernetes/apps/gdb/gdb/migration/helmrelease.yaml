---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-migration
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    force: true
    remediation:
      retries: 3
      strategy: rollback
  interval: 30m
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
    controllers:
      migrate-v1-10-58:
        type: job
        job:
          activeDeadlineSeconds: 3600
          backoffLimit: 1
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-web
              tag: 1.10.58@sha256:bb88187032e94b35b7dc2ebb1777500ce4499c43319d9256d7e70b9fa7dacb02
            command:
              - /app/migrate.sh
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-runtime-secret
                    key: DATABASE_URL
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
