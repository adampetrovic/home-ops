---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb-scrapers
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      worker:
        enabled: true
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-scraper
              tag: 0.1.102@sha256:c3f07f3fc814f80cff91573064cfed6c88a3e2696a2e16e99d2c6c2eece6546c
            command: [python, -m, scraper.jobs.worker]
            envFrom:
              - secretRef:
                  name: gdb-secret
            env:
              OUTPUT_DIR: /app/output
              MSO_CACHE_DIR: /app/output/mso-cache
              MMS_CACHE_DIR: /app/output/mms-cache
              PYTHONDONTWRITEBYTECODE: "1"
              LOG_LEVEL: INFO
              JOB_WORKER_ID:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              JOB_IMAGE: ghcr.io/adampetrovic/gdb-scraper:0.1.102
              JOB_IMAGE_DIGEST: sha256:c3f07f3fc814f80cff91573064cfed6c88a3e2696a2e16e99d2c6c2eece6546c
              HTTP_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              HTTPS_PROXY:
                valueFrom:
                  secretKeyRef:
                    name: gdb-secret
                    key: EXTERNAL_PROXY_URL
              NO_PROXY: .svc,.cluster.local,10.0.0.0/8,127.0.0.1,localhost
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    persistence:
      output:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: ceph-block
        globalMounts:
          - path: /app/output
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
