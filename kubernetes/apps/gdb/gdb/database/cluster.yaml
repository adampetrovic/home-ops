---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gdb-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:18.6-3.7.0-standard-bookworm@sha256:c5daee7ec0c2d50db9c11f5fb8fe5099be1b87a4d88a0b4cd157084fefe9fed8
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 40Gi
    storageClass: openebs-hostpath
  enableSuperuserAccess: false
  postgresql:
    parameters:
      wal_compression: lz4
      archive_timeout: 30min
      checkpoint_timeout: 15min
  bootstrap:
    recovery:
      source: source
  enablePDB: true
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &backup
        barmanObjectName: garage
        serverName: gdb-postgres
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *backup
