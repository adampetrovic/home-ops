---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gdb-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:18.7-3.7.0-standard-bookworm@sha256:4674ccb345194b8cbe39194d6db4c0a1b301a2f7b6c00407ec4ce3c12d71c8d1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 40Gi
    storageClass: openebs-hostpath
  enableSuperuserAccess: false
  postgresql:
    parameters:
      wal_compression: lz4
      archive_timeout: 30min
  bootstrap:
    recovery:
      source: source
  enablePDB: true
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &backup
        barmanObjectName: garage
        serverName: gdb-postgres
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *backup
