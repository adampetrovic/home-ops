---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gdb
spec:
  cluster:
    name: gdb-postgres
  name: gdb
  owner: gdb
  ensure: present
  databaseReclaimPolicy: retain
  extensions:
    - name: postgis
      ensure: present
    - name: pg_trgm
      ensure: present
