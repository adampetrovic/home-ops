---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-nfs-backup-rules
spec:
  groups:
    - name: kopiur-nfs.rules
      rules:
        - alert: KopiurNfsBackupStale
          annotations:
            summary: No recent NFS backup for {{ $labels.namespace }}/{{ $labels.policy }}
            description: >-
              Either the last successful NFS backup was over 48h ago, or
              SnapshotPolicy {{ $labels.namespace }}/{{ $labels.policy }} has
              never succeeded and is currently failing.
          expr: |-
            (
              time() - max by (namespace, policy) (kopiur_policy_last_backup_success_timestamp_seconds{policy=~".+-nfs"}) > 172800
            ) or (
              max by (namespace, policy) (label_replace(kopiur_snapshot_consecutive_failures{name=~".+-nfs"}, "policy", "$1", "name", "(.*)")) > 0
              unless on (namespace, policy) kopiur_policy_last_backup_success_timestamp_seconds{policy=~".+-nfs"}
            )
          for: 30m
          labels:
            severity: warning
