---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-r2
spec:
  backend:
    s3:
      bucket: kopiur
      endpoint: ${SECRET_CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: kopiur-r2-repository
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-r2-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  credentialProjection:
    allowed: true
  allowedNamespaces:
    list:
      - automation
      - database
      - default
      - gdb
      - kopiur-system
      - media
      - network
      - observability
      - projects
      - storage
  identityDefaults:
    cluster: home-kubernetes
    hostnameExpr: 'namespace + "." + cluster'
    usernameExpr: 'namespace + "-" + policyName'
  scheduleDefaults:
    timezone: Australia/Sydney
    jitter: 10m
  create:
    enabled: false
  deletionProtection:
    threshold: 10
  catalog:
    adoption: Ignore
    foreignSnapshots: Ignore
  health:
    probe:
      enabled: true
      onFailure: Degrade
  moverDefaults:
    cache:
      mode: Persistent
      capacity: 5Gi
      storageClassName: ceph-block-cache
  maintenance:
    enabled: true
    namespace: kopiur-system
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-nfs
spec:
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: nas.petrovic.network
          path: /var/nfs/shared/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-nfs-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  credentialProjection:
    allowed: true
  allowedNamespaces:
    list:
      - automation
      - database
      - default
      - gdb
      - kopiur-system
      - media
      - network
      - observability
      - projects
      - storage
  identityDefaults:
    cluster: home-kubernetes
    hostnameExpr: 'namespace + "." + cluster'
    usernameExpr: 'namespace + "-" + policyName'
  scheduleDefaults:
    timezone: Australia/Sydney
    jitter: 10m
  parameters:
    epoch:
      minDuration: 1h
  create:
    enabled: false
  deletionProtection:
    threshold: 10
  catalog:
    adoption: Ignore
    foreignSnapshots: Ignore
  health:
    probe:
      enabled: true
      onFailure: Degrade
  maintenance:
    enabled: true
    namespace: kopiur-system
    schedule:
      quick:
        cron: "0 * * * *"
        jitter: 30m
      full:
        cron: "0 3 * * *"
        jitter: 1h
  moverDefaults:
    cache:
      mode: Persistent
      capacity: 5Gi
      storageClassName: ceph-block-cache
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
