---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app readeck
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      readeck:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: codeberg.org/readeck/readeck
              tag: 0.23.0@sha256:6738c7fea3da8169f7da7bdb77a068c753c9edb538cdfc81226ace537727c7a3
            env:
              READECK_LOG_LEVEL: info
              READECK_LOG_FORMAT: text
              READECK_SERVER_HOST: 0.0.0.0
              READECK_SERVER_PORT: &port 8000
              READECK_SERVER_BASE_URL: https://readeck.${SECRET_PUBLIC_DOMAIN}
              READECK_AUTH_OIDC_PROVIDERS_1_NAME: Authelia
              READECK_AUTH_OIDC_PROVIDERS_1_URL: https://auth.${SECRET_PUBLIC_DOMAIN}
              READECK_AUTH_OIDC_PROVIDERS_1_CLIENT_ID: readeck
              READECK_AUTH_OIDC_PROVIDERS_1_GROUPS: admin=admin users=user
              READECK_AUTH_OIDC_PROVIDERS_1_PROVISIONING: "true"
            envFrom:
              - secretRef:
                  name: readeck-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: readeck
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "readeck.${SECRET_PUBLIC_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /readeck
