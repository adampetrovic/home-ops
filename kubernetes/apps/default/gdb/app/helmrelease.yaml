---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gdb
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
    controllers:
      api:
        replicas: 1
        strategy: Recreate
        initContainers:
          migrate:
            image:
              repository: ghcr.io/adampetrovic/gdb-api
              tag: release-b187464b3217b2a30717257d06f2bbb554f25581@sha256:66faa0ecb44b7d7efd906308945f0582d55852376cb32f429e210f4eaf6d2180
            command: ["alembic", "upgrade", "head"]
            env:
              GDB_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: GDB_DATABASE_URL
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-api
              tag: release-b187464b3217b2a30717257d06f2bbb554f25581@sha256:66faa0ecb44b7d7efd906308945f0582d55852376cb32f429e210f4eaf6d2180
            env:
              GDB_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: GDB_DATABASE_URL
              GDB_APP_ORIGIN: https://gdb.petrovic.network
              GDB_ENVIRONMENT: production
              GDB_LISTEN_HOST: 0.0.0.0
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                    httpHeaders:
                      - name: Host
                        value: gdb.petrovic.network
                  periodSeconds: 10
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            runAsNonRoot: true
      worker:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/gdb-worker
              tag: release-b187464b3217b2a30717257d06f2bbb554f25581@sha256:d640deaf862e0fed5c1c425d355e01145773bbe11fd043155b2766ad2667570d
            env:
              GDB_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: gdb-db-secret
                    key: GDB_DATABASE_URL
              GDB_ARTIFACT_ROOT: /var/lib/gdb/artifacts
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        pod:
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            runAsNonRoot: true
    service:
      api:
        controller: api
        ports:
          http:
            port: 8000
    route:
      main:
        hostnames:
          - gdb.petrovic.network
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: api
                port: http
    persistence:
      artifacts:
        existingClaim: gdb-artifacts
        advancedMounts:
          worker:
            app:
              - path: /var/lib/gdb/artifacts
