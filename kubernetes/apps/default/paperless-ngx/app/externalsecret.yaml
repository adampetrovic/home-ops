---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_DBENGINE: postgresql
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBHOST: &dbHost postgres-rw.database.svc.cluster.local
        PAPERLESS_DBNAME: &dbName paperless
        PAPERLESS_DBUSER: &dbUser "{{ .POSTGRES_USER }}"
        PAPERLESS_DBPASS: &dbPass "{{ .POSTGRES_PASS }}"

        PAPERLESS_ADMIN_USER: "{{ .ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .ADMIN_PASS }}"
        PAPERLESS_SECRET_KEY: "{{ .SECRET_KEY }}"

        PAPERLESS_GMAIL_OAUTH_CLIENT_ID: "{{ .PAPERLESS_GMAIL_OAUTH_CLIENT_ID }}"
        PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET: "{{ .PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET }}"

        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        PAPERLESS_API_TOKEN: "{{ .API_KEY }}"
        PAPERLESS_LLM_EXTRA_CONTEXT: "{{ .LLM_EXTRA_CONTEXT }}"
  dataFrom:
    - extract:
        key: paperless
