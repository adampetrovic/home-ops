---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memos-secret
    template:
      data:
        POSTGRES_URL: "postgres://{{ .MEMOS_POSTGRES_USER }}:{{ .MEMOS_POSTGRES_PASS }}@postgres-rw.database.svc.cluster.local/memos?sslmode=disable"
  dataFrom:
    - extract:
        key: memos
      rewrite:
        - regexp:
            source: "(.*)"
            target: "MEMOS_$1"
