---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: babybuddy
spec:
  description: >-
    Baby Buddy trusts the Remote-User header, so only the internal gateway,
    Home Assistant and Gatus may reach it.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: babybuddy
      app.kubernetes.io/controller: babybuddy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: automation
            app.kubernetes.io/name: home-assistant
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
