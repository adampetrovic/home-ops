---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: babybuddy
spec:
  description: >-
    Baby Buddy logs in whoever the Remote-User header names, so only the
    internal gateway may send it. Home Assistant and Gatus may reach the app
    directly, but Cilium's proxy strips any Remote-User header they send.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: babybuddy
      app.kubernetes.io/controller: babybuddy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: automation
            app.kubernetes.io/name: home-assistant
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
          rules:
            http:
              # A header can't carry a control character, so this never
              # matches and DELETE removes any Remote-User the peer sends.
              - headerMatches:
                  - name: Remote-User
                    value: "\x01"
                    mismatch: DELETE
