---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin
    # The chart renders <hub>/intel-gpu-plugin:<tag>, and the operator webhook rejects
    # tag@digest references, so only the registry is overridden; the tag follows the
    # chart appVersion.
    image:
      hub: mirror.gcr.io/intel
    sharedDevNum: 4
    nodeFeatureRule: false
