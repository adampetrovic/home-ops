---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "petrovic-network-production"
spec:
  secretName: "petrovic-network-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "petrovic.network"
  dnsNames:
    - "petrovic.network"
    - "*.petrovic.network"
    - "${SECRET_PUBLIC_DOMAIN}"
    - "*.${SECRET_PUBLIC_DOMAIN}"
    - "${SECRET_PUBLIC_ANON_DOMAIN}"
    - "*.${SECRET_PUBLIC_ANON_DOMAIN}"
    - "${SECRET_PLEX_DOMAIN}"
    - "*.${SECRET_PLEX_DOMAIN}"
