---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: adguard-0-r2
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-r2
  sources:
    - pvc:
        name: data-adguard-0
      readOnly: true
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  compression:
    compressor: zstd
  errorHandling:
    ignoreDirErrors: false
    ignoreFileErrors: false
    ignoreUnknownTypes: false
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 1
  deletion:
    onPolicyDelete: Retain
  mover:
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: ceph-block
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: adguard-0-r2
spec:
  policyRef:
    name: adguard-0-r2
  schedule:
    cron: "H H * * 0"
    concurrencyPolicy: Forbid
    runOnCreate: false
    suspend: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
