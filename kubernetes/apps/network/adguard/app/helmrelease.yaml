---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adguard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-private
    controllers:
      adguard:
        type: statefulset
        replicas: 2
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: tls-adguard
        podDisruptionBudget:
          minAvailable: 1
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: adguard
                  app.kubernetes.io/name: *app
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: headless
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain
          volumeClaimTemplates:
            - name: data
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 5Gi
              # Clone the primary restored PVC into additional StatefulSet ordinals on first creation.
              # Kopiur protects data-adguard-0; adguardhome-sync repopulates
              # data-adguard-1 from the primary replica.
              dataSource:
                kind: PersistentVolumeClaim
                name: data-adguard-0
              globalMounts:
                - path: /opt/adguardhome/conf
                  subPath: conf
                - path: /opt/adguardhome/work
                  subPath: work
        initContainers:
          01-permissions:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0@sha256:026ed7273270ec08f6902b4ae8334c23b473e5394bec3bbbdbfe580c710d50bc
            command:
              - /bin/sh
              - -ec
              - |
                chown -R 1001:1001 /opt/adguardhome/conf /opt/adguardhome/work
                chmod -R u+rwX,g+rwX /opt/adguardhome/conf /opt/adguardhome/work
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        containers:
          app:
            image:
              repository: ghcr.io/adampetrovic/adguardhome
              tag: v0.107.79@sha256:9b81408a497c3a9b821023c7357ec60aebbd7cc58bf0545dfeeb6ca868f812e8
            env:
              TZ: "${TZ}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["NET_BIND_SERVICE"]
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 443
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: false

      sync:
        annotations:
          secret.reloader.stakater.com/reload: adguard-sync-secret
        containers:
          app:
            image:
              repository: ghcr.io/bakito/adguardhome-sync
              tag: v0.9.3@sha256:b3499852640866c5742fd72cca190f40e2741c279d60fd62b9130cd8142aafec
            args: ["run"]
            env:
              API_METRICS_ENABLED: "true"
              API_PORT: &syncPort 8080
              CONTINUE_ON_ERROR: "false"
              CRON: "*/15 * * * *"
              FEATURES_DHCP_SERVER_CONFIG: "false"
              FEATURES_DHCP_STATIC_LEASES: "false"
              FEATURES_PROTECTION_STATUS: "true"
              FEATURES_TLS_CONFIG: "true"
              HTTP_CLIENT_TIMEOUT: 10s
              LOG_FORMAT: json
              LOG_LEVEL: info
              ORIGIN_URL: http://adguard-0.adguard-headless.network.svc.cluster.local
              REPLICA1_URL: http://adguard-1.adguard-headless.network.svc.cluster.local
              RUN_ON_START: "true"
              TZ: "${TZ}"
            envFrom:
              - secretRef:
                  name: adguard-sync-secret
            probes:
              liveness: &syncProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *syncPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *syncProbe
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault

    service:
      app:
        forceRename: *app
        controller: adguard
        extraSelectorLabels:
          apps.kubernetes.io/pod-index: "0"
        ports:
          http:
            port: 80
      dns:
        controller: adguard
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: dns.petrovic.network
          lbipam.cilium.io/ips: 10.0.88.53
        ports:
          dns-https:
            port: 443
            protocol: TCP
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP
          tls-tcp:
            port: 853
            protocol: TCP
      headless:
        controller: adguard
        clusterIP: None
        publishNotReadyAddresses: true
        ports:
          http:
            port: 80
          setup:
            port: 3000
      sync:
        controller: sync
        ports:
          http:
            port: *syncPort

    serviceMonitor:
      sync:
        enabled: true
        serviceName: adguard-sync
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      main:
        annotations:
          gatus.home-operations.com/enabled: "true"
        hostnames:
          - "adguard.petrovic.network"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      tls:
        enabled: true
        type: secret
        name: tls-adguard
        advancedMounts:
          adguard:
            app:
              - path: /opt/adguardhome/ssl/certs/
                readOnly: true
