---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app adguard
  namespace: &namespace network
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
    - name: cert-manager
      namespace: cert-manager
    - name: rook-ceph-cluster
      namespace: rook-ceph
  components:
  path: ./kubernetes/apps/network/adguard/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard-0-backup
  namespace: network
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: adguard-0
  dependsOn:
    - name: kopiur-repositories
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./kubernetes/apps/network/adguard/backups/adguard-0
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: adguard-0
      KOPIUR_SOURCE_PVC: data-adguard-0
      KOPIUR_PVC_NAME: adguard
      KOPIUR_RESTORE_NAME: adguard
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "1001"
      KOPIUR_PGID: "568"
