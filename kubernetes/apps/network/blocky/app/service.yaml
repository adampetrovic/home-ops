---
# Puts envoy-internal on port 443 of the DNS VIP, so the doh route is the only
# path from that port to Blocky.
apiVersion: v1
kind: Service
metadata:
  name: blocky-doh
  annotations:
    lbipam.cilium.io/ips: 10.0.88.53
    lbipam.cilium.io/sharing-key: blocky
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 10443
  selector:
    gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    gateway.envoyproxy.io/owning-gateway-namespace: network
