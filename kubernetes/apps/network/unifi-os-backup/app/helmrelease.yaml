---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-os-backup
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      unifi-os-backup:
        replicas: 1
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: unifi-os-backup-secret
        containers:
          app:
            image:
              repository: ghcr.io/mafredri/unifi-os-backup
              tag: main@sha256:65c3dd62a52a4afb08c7162e3861d6219a51492809992302698ee76ba85edcb4
            env:
              TZ: ${TZ}
              LISTEN_ADDRESS: 0.0.0.0:8080
              BACKUP_DIRECTORY: /backups
              CONSOLES: cloudkey,unas
              CONSOLE_CLOUDKEY_URL: https://10.0.0.1
              CONSOLE_CLOUDKEY_USERNAME_FILE: /run/secrets/unifi-os-backup/username
              CONSOLE_CLOUDKEY_PASSWORD_FILE: /run/secrets/unifi-os-backup/password
              CONSOLE_CLOUDKEY_TARGETS: full,network
              CONSOLE_CLOUDKEY_BACKUP_INTERVAL: 24h
              CONSOLE_CLOUDKEY_HEALTH_MAX_AGE: 48h
              CONSOLE_CLOUDKEY_HTTP_TIMEOUT: 30m
              CONSOLE_CLOUDKEY_SKIP_TLS_VERIFY: "true"
              CONSOLE_CLOUDKEY_RETENTION_DAILY: "14"
              CONSOLE_CLOUDKEY_RETENTION_WEEKLY: "12"
              CONSOLE_CLOUDKEY_WEEKLY_INTERVAL: 168h
              CONSOLE_UNAS_URL: https://unas-direct.${SECRET_DOMAIN}
              CONSOLE_UNAS_USERNAME_FILE: /run/secrets/unifi-os-backup/username
              CONSOLE_UNAS_PASSWORD_FILE: /run/secrets/unifi-os-backup/password
              CONSOLE_UNAS_TARGETS: full
              CONSOLE_UNAS_BACKUP_INTERVAL: 24h
              CONSOLE_UNAS_HEALTH_MAX_AGE: 48h
              CONSOLE_UNAS_HTTP_TIMEOUT: 30m
              CONSOLE_UNAS_SKIP_TLS_VERIFY: "true"
              CONSOLE_UNAS_RETENTION_DAILY: "14"
              CONSOLE_UNAS_RETENTION_WEEKLY: "12"
              CONSOLE_UNAS_WEEKLY_INTERVAL: 168h
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      backups:
        existingClaim: *app
        globalMounts:
          - path: /backups
      credentials:
        enabled: true
        type: secret
        name: unifi-os-backup-secret
        globalMounts:
          - path: /run/secrets/unifi-os-backup
            readOnly: true
