---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
            env:
              TZ: ${TZ}
              PLEX_ADVERTISE_URL: https://plex.petrovic.network:443,http://10.0.88.3:32400,http://plex.media.svc.cluster.local:32400
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 3Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 6Gi
          vector:
            image:
              repository: mirror.gcr.io/timberio/vector
              tag: 0.60.0-alpine@sha256:1c6a6c4c5c9de08df357fa8adbe72e5a7abcea458b0bd82de0b14ac9b79d5b31
            env:
              VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
            args:
              - --config-yaml
              - /etc/vector/vector.yaml
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: In
                        values: ["true"]
                      - key: node-role.kubernetes.io/worker
                        operator: Exists
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values: ["frigate"]
                    namespaces: ["automation"]
                    topologyKey: kubernetes.io/hostname
          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            runAsNonRoot: true
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            supplementalGroups: [44, 100]

    service:
      app:
        type: LoadBalancer
        controller: plex
        annotations:
          external-dns.kubernetes.io/hostname: plex-direct.petrovic.network
          lbipam.cilium.io/ips: 10.0.88.3
        externalTrafficPolicy: Local
        ports:
          http:
            port: 32400
    route:
      app:
        hostnames:
          - "plex.petrovic.network"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    # Envoy already appends X-Forwarded-For with the
                    # real client IP. Add the remaining proxy context
                    # Plex/Tracearr expect for geolocation.
                    - name: X-Forwarded-Proto
                      value: https
                    - name: X-Forwarded-Host
                      value: plex.petrovic.network
            backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        enabled: true
        existingClaim: plex
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server
      vector-data:
        type: emptyDir
        advancedMounts:
          plex:
            vector:
              - path: /vector-data-dir
      vector-config:
        type: configMap
        name: plex-vector-config
        advancedMounts:
          plex:
            vector:
              - path: /etc/vector/vector.yaml
                subPath: vector.yaml
                readOnly: true

      # Separate PVC for cache to avoid backing up cache files
      plex-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      movies:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/movies
        advancedMounts:
          plex:
            app:
              - path: /movies
                readOnly: true
      movies-kids:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/kids/movies
        advancedMounts:
          plex:
            app:
              - path: /movies-kids
                readOnly: true
      tv:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/tv
        advancedMounts:
          plex:
            app:
              - path: /tv
                readOnly: true
      tv-kids:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/kids/tv
        advancedMounts:
          plex:
            app:
              - path: /tv-kids
                readOnly: true
      music:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/music
        advancedMounts:
          plex:
            app:
              - path: /music
                readOnly: true
      family:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/family
        advancedMounts:
          plex:
            app:
              - path: /family
                readOnly: true
