---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
spec:
  description: >-
    Allow Plex's Vector sidecar to push logs to Loki, and nothing else on Loki.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plex
      app.kubernetes.io/controller: plex
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: loki
            app.kubernetes.io/instance: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
          rules:
            http:
              - method: "^POST$"
                path: "^/loki/api/v1/push$"
