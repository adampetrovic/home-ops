---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      dispatcharr:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: dispatcharr-secret
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.29.0@sha256:df768adcb9993b58f5e67010cc802c8659b7f964cb1213ab7ff9bb9384db9145
            env:
              TZ: "${TZ}"
              PUID: "568"
              PGID: "568"
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: "9191"
              DISPATCHARR_LOG_LEVEL: info
              DISPATCHARR_ENABLE_IP_LOOKUP: "false"
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_DB: "12"
              CELERY_BROKER_URL: redis://dragonfly.database.svc.cluster.local:6379/12
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9191
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - KILL
                  - SETGID
                  - SETUID
          celery:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.29.0@sha256:df768adcb9993b58f5e67010cc802c8659b7f964cb1213ab7ff9bb9384db9145
            command: ["/app/docker/entrypoint.celery.sh"]
            env:
              TZ: "${TZ}"
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: "9191"
              DISPATCHARR_WEB_HOST: localhost
              DISPATCHARR_LOG_LEVEL: info
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_DB: "12"
              CELERY_BROKER_URL: redis://dragonfly.database.svc.cluster.local:6379/12
              DJANGO_SETTINGS_MODULE: dispatcharr.settings
              PYTHONUNBUFFERED: "1"
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext: *securityContext
          proxy:
            image:
              repository: mirror.gcr.io/library/caddy
              tag: 2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
            command: ["/bin/sh", "-c"]
            args:
              - |
                cp /usr/bin/caddy /tmp/caddy
                exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
            env:
              XDG_CONFIG_HOME: /tmp/config
              XDG_DATA_HOME: /tmp/data
            probes:
              liveness: &proxyProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &proxyPort 9192
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *proxyProbe
              startup: *proxyProbe
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    configMaps:
      proxy:
        data:
          Caddyfile: |
            {
              admin off
              auto_https off
            }

            :9192 {
              @lineupPost {
                method POST
                path /hdhr/lineup.post
              }
              handle @lineupPost {
                respond 200
              }
              @lineupStatus {
                method GET
                path /hdhr/lineup_status.json
              }
              handle @lineupStatus {
                header Content-Type application/json
                respond `{"ScanInProgress":0,"ScanPossible":1,"Source":"Cable","SourceList":["Cable"]}` 200
              }
              handle {
                reverse_proxy 127.0.0.1:9191
              }
            }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
            targetPort: *proxyPort
    route:
      app:
        hostnames:
          - "dispatcharr.${SECRET_DOMAIN}"
          - "xteve.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      proxy-config:
        type: configMap
        identifier: proxy
        advancedMounts:
          dispatcharr:
            proxy:
              - path: /etc/caddy/Caddyfile
                subPath: Caddyfile
                readOnly: true
      proxy-tmp:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            proxy:
              - path: /tmp
