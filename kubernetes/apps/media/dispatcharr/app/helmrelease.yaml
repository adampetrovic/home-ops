---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      dispatcharr:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.28.2@sha256:3eb0ec779f3437ec64c08a9b3f545a355a8f512f3740cdeaac42b80f1021637d
            env:
              TZ: "${TZ}"
              PUID: "568"
              PGID: "568"
              DB_ENGINE: sqlite
              DISPATCHARR_ENV: aio
              DISPATCHARR_PORT: "9191"
              DISPATCHARR_LOG_LEVEL: info
              DISPATCHARR_ENABLE_IP_LOOKUP: "false"
              REDIS_HOST: localhost
              REDIS_PORT: "6379"
              REDIS_DB: "0"
              CELERY_BROKER_URL: redis://localhost:6379/0
            # The upstream entrypoint runs Django/Celery via `su -`, which only
            # keeps env vars written to /etc/environment. Persist DB_ENGINE here
            # so child processes use SQLite rather than the bundled Postgres.
            command: ["/bin/bash", "-lc"]
            args:
              - |
                set -Eeuo pipefail
                sed -i '/^DB_ENGINE=/d' /etc/environment
                printf "DB_ENGINE='sqlite'\n" >> /etc/environment
                mkdir -p /data
                touch /data/dispatcharr.db
                chown "${PUID:-568}:${PGID:-568}" /data /data/dispatcharr.db
                cat > /etc/profile.d/dispatcharr-db-engine.sh <<'EOF'
                export DB_ENGINE='sqlite'
                EOF
                exec /app/docker/entrypoint.sh
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9191
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - KILL
                  - SETGID
                  - SETUID
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "dispatcharr.${SECRET_DOMAIN}"
          - "xteve.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
