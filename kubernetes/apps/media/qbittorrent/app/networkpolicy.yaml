---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
spec:
  description: >-
    The qBittorrent web UI trusts private source IPs without a login, so only
    the internal gateway and the apps that drive it may reach it, while peers
    can still reach the BitTorrent port.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
      app.kubernetes.io/controller: qbittorrent
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: qui
            app.kubernetes.io/controller: qui
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: sonarr
            app.kubernetes.io/controller: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: radarr
            app.kubernetes.io/controller: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: lidarr
            app.kubernetes.io/controller: lidarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: plexovic-gatus
            app.kubernetes.io/controller: gatus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "50413"
              protocol: TCP
