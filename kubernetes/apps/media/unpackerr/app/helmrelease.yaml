---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unpackerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: mirror.gcr.io/golift/unpackerr
              tag: v1.0.1@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            env:
              TZ: "${TZ}"
              UN_WEBSERVER_METRICS: 'true'
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
              UN_WEBSERVER_UI_PASSWORD: webauth:Remote-User
              # Envoy pods use this CIDR; NetworkPolicy limits ingress to envoy-internal.
              UN_WEBSERVER_UPSTREAMS_0: 10.69.0.0/16
              UN_LOG_FILE: /config/unpackerr.log
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /downloads/complete/qbt/tv
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /downloads/complete/qbt/movies
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                type: TCP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 5656
    route:
      app:
        hostnames:
          - unpackerr.petrovic.network
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      downloads:
        type: nfs
        server: ${SECRET_NFS_DOMAIN}
        path: /var/nfs/shared/media/downloads
        globalMounts:
          - path: /downloads
