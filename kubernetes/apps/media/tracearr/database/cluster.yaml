---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202611030838-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  bootstrap:
    recovery:
      source: source
  postgresql:
    extensions:
      - name: timescaledb
        image:
          reference: ghcr.io/adampetrovic/timescaledb-cnpg:2.26.1-tsl-18-trixie
    shared_preload_libraries:
      - timescaledb
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      wal_compression: lz4
      max_locks_per_transaction: "4096"
      timescaledb.license: "timescale"
      timescaledb.max_tuples_decompressed_per_dml_transaction: "0"
      timescaledb.telemetry_level: "off"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  # Draining the primary's node switches over to a replica first
  enablePDB: true
  resources:
    requests:
      cpu: 25m
      memory: 1Gi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &parameters
        barmanObjectName: tracearr-garage
        serverName: tracearr-postgres
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *parameters
