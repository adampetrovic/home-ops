---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11-1.1.1@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: ceph-block
  enableSuperuserAccess: true
  superuserSecret:
    name: bookorbit-db-superuser-secret
  bootstrap:
    recovery:
      source: source
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      wal_compression: lz4
      # Each forced WAL switch writes a full 16MiB segment; the CNPG default is 5min.
      archive_timeout: 30min
      # Postgres logs a full copy of each page the first time it changes after a
      # checkpoint, so checkpointing less often shrinks WAL; the default is 5min.
      checkpoint_timeout: 15min
  enablePDB: false
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &parameters
        barmanObjectName: bookorbit-garage
        serverName: bookorbit-postgres
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *parameters
