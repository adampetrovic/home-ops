---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  cluster:
    name: immich-postgres
  name: immich
  owner: immich
  ensure: present
  databaseReclaimPolicy: retain
  # immich connects without superuser, so it can't upgrade these itself.
  # Bump the versions alongside the imageName in cluster.yaml.
  extensions:
    - name: vector
      ensure: present
      version: 0.8.1
    - name: vchord
      ensure: present
      version: 1.1.0
    - name: uuid-ossp
      ensure: present
    - name: unaccent
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
    - name: pg_trgm
      ensure: present
