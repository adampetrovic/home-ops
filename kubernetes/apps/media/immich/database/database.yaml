---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  cluster:
    name: immich-postgres
  name: immich
  owner: immich
  ensure: present
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: uuid-ossp
      ensure: present
    - name: unaccent
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
    - name: pg_trgm
      ensure: present
