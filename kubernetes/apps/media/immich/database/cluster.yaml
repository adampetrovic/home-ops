---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.11-1.1.1@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  enableSuperuserAccess: true
  superuserSecret:
    name: immich-db-superuser-secret
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      wal_compression: lz4
      # Each forced WAL switch writes a full 16MiB segment; the CNPG default is 5min.
      archive_timeout: 30min
      # Postgres logs a full copy of each page the first time it changes after a
      # checkpoint, so checkpointing less often shrinks WAL; the default is 5min.
      checkpoint_timeout: 15min
    shared_preload_libraries:
      - "vchord.so"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  # Draining the primary's node switches over to a replica first
  enablePDB: true
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &parameters
        barmanObjectName: immich-garage
        serverName: immich-postgres
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *parameters
