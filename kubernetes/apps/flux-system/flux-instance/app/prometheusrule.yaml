---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
  namespace: flux-system
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: |-
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 5m
          annotations:
            summary: >-
              Flux instance metric is missing
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: |-
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 5m
          annotations:
            summary: >-
              Flux instance {{ $labels.name }} is not ready
          labels:
            severity: critical

        - alert: HelmReleaseReconciliationFailure
          expr: |-
            flux_resource_info{kind="HelmRelease", ready!="True", suspended!="True"} == 1
          for: 5m
          annotations:
            summary: >-
              HelmRelease {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical

        - alert: KustomizationReconciliationFailure
          expr: |-
            flux_resource_info{kind="Kustomization", ready!="True", reason!="DependencyNotReady", suspended!="True"} == 1
          for: 5m
          annotations:
            summary: >-
              Kustomization {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
          labels:
            severity: critical

        - alert: KustomizationsBlockedOnDependency
          expr: |-
            count(flux_resource_info{kind="Kustomization", reason="DependencyNotReady", suspended!="True"} == 1) > 0
          for: 30m
          annotations:
            summary: >-
              {{ $value }} Kustomizations are waiting on a dependency that is not ready
            description: >-
              Kustomizations have reported DependencyNotReady for 30 minutes.
              Find the root with flux get ks -A --status-selector ready=false;
              it may be suspended or missing rather than failing.
          labels:
            severity: warning

        - alert: FluxSourceReconciliationFailure
          expr: |-
            flux_resource_info{kind=~"OCIRepository|GitRepository|HelmRepository|HelmChart|Receiver", ready="False", suspended!="True"} == 1
          for: 15m
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready
            description: >-
              Flux cannot fetch or serve this source ({{ $labels.reason }}).
              Releases and Kustomizations built from it are stuck on their last
              revision.
          labels:
            severity: warning
