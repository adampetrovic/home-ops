---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pgadmin-secret
    template:
      engineVersion: v2
      data:
        PGADMIN_DEFAULT_EMAIL: "{{ .PGADMIN_DEFAULT_EMAIL }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .PGADMIN_DEFAULT_PASSWORD }}"
        PGADMIN_CONFIG_OAUTH2_CONFIG: >-
          [{
          'OAUTH2_NAME': 'authelia',
          'OAUTH2_DISPLAY_NAME': 'Authelia',
          'OAUTH2_CLIENT_ID': 'pgadmin',
          'OAUTH2_CLIENT_SECRET': '{{ .PGADMIN_OAUTH_CLIENT_SECRET }}',
          'OAUTH2_SERVER_METADATA_URL': 'https://auth.petrovic.network/.well-known/openid-configuration',
          'OAUTH2_API_BASE_URL': 'https://auth.petrovic.network',
          'OAUTH2_AUTHORIZATION_URL': 'https://auth.petrovic.network/api/oidc/authorization',
          'OAUTH2_TOKEN_URL': 'https://auth.petrovic.network/api/oidc/token',
          'OAUTH2_USERINFO_ENDPOINT': 'https://auth.petrovic.network/api/oidc/userinfo',
          'OAUTH2_SCOPE': 'openid email profile',
          'OAUTH2_USERNAME_CLAIM': 'email',
          'OAUTH2_ICON': 'fa-openid',
          'OAUTH2_BUTTON_COLOR': '#000000'
          }]
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: pgadmin
