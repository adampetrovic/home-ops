---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-cutover-verify
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      strategy: rollback
      retries: 0
  values:
    controllers:
      verify:
        type: job
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: mirror.gcr.io/amazon/aws-cli
              tag: 2.31.0@sha256:3b018ce74732c98acf6f1de59b3a89587cb7f9eb6ea0d1447d1779091b2bf057
            command: ["/bin/sh", "-ec"]
            args:
              - |
                export AWS_CONFIG_FILE=/tmp/aws-config AWS_SHARED_CREDENTIALS_FILE=/tmp/aws-credentials AWS_PAGER=''
                endpoint=http://garage.storage.svc.cluster.local:3900
                ready=false
                for attempt in $(seq 1 60); do
                  if aws --endpoint-url "$endpoint" --cli-connect-timeout 2 --cli-read-timeout 3 s3api head-bucket --bucket postgres >/tmp/ready-response 2>/tmp/ready-error; then
                    ready=true
                    break
                  fi
                  sleep 2
                done
                test "$ready" = true
                old=postgres/wals/0000001D00000406/0000001D0000040600000077.lz4
                listed=$(aws --endpoint-url "$endpoint" s3api list-objects-v2 --bucket postgres --prefix "$old" --max-keys 1 --query 'Contents[0].Key' --output text)
                test "$listed" = "$old"
                aws --endpoint-url "$endpoint" s3api get-object --bucket postgres --key "$old" /tmp/old-object >/tmp/old-response
                printf '%s  %s\n' 06aba1648a6a610c8a3b8f8396e6aef87ef0593ad3365e21a9b54dac3e14d2d8 /tmp/old-object | sha256sum -c -
                test "$(wc -c < /tmp/old-object)" -eq 7754706
                echo 'Existing object list/read and full baseline SHA256 verified'
                testkey="__garage-migration-validation__/20261011-$(date -u +%Y%m%dT%H%M%SZ)"
                printf 'Garage metadata migration verification 2026-10-11\n' > /tmp/payload
                trap 'aws --endpoint-url "$endpoint" s3api delete-object --bucket postgres --key "$testkey" >/tmp/cleanup-response 2>/tmp/cleanup-error || true' EXIT
                aws --endpoint-url "$endpoint" s3api put-object --bucket postgres --key "$testkey" --body /tmp/payload >/tmp/put-response
                aws --endpoint-url "$endpoint" s3api get-object --bucket postgres --key "$testkey" /tmp/readback >/tmp/get-response
                cmp /tmp/payload /tmp/readback
                aws --endpoint-url "$endpoint" s3api delete-object --bucket postgres --key "$testkey" >/tmp/delete-response
                if aws --endpoint-url "$endpoint" s3api head-object --bucket postgres --key "$testkey" >/tmp/head-response 2>/tmp/head-error; then
                  echo 'ERROR: deleted test object still exists'
                  exit 1
                fi
                grep -Eq '404|Not Found|NotFound' /tmp/head-error
                trap - EXIT
                date -u '+old_object_and_authorized_put_get_delete_verified=%Y-%m-%dT%H:%M:%SZ'
            env:
              AWS_DEFAULT_REGION: us-east-1
              AWS_MAX_ATTEMPTS: "1"
              AWS_REQUEST_CHECKSUM_CALCULATION: when_required
              AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              AWS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: aws-access-key-id
              AWS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: aws-secret-access-key
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        seccompProfile: { type: RuntimeDefault }
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
