---
# Temporary: drops roles and databases left behind by removed apps.
# Databases are dropped by ensure: absent. DatabaseRole doesn't support
# ensure: absent, so roles are adopted with a delete reclaim policy and
# dropped when this file is removed, after every CR reports APPLIED true.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: drop-autobrr
spec:
  cluster:
    name: postgres
  name: autobrr
  owner: autobrr
  ensure: absent
---
