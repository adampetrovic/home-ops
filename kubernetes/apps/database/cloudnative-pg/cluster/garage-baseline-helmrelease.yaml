---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-baseline-read
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      strategy: rollback
  values:
    controllers:
      verify:
        type: job
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 300
        containers:
          app:
            image:
              repository: mirror.gcr.io/amazon/aws-cli
              tag: 2.31.0@sha256:3b018ce74732c98acf6f1de59b3a89587cb7f9eb6ea0d1447d1779091b2bf057
            command: ["/bin/sh", "-ec"]
            args:
              - |
                export AWS_CONFIG_FILE=/tmp/aws-config AWS_SHARED_CREDENTIALS_FILE=/tmp/aws-credentials AWS_PAGER=''
                key=$(aws --endpoint-url http://garage.storage.svc.cluster.local:3900 s3api list-objects-v2 --bucket postgres --prefix postgres/wals/ --max-keys 1000 --query 'Contents[-1].Key' --output text)
                test -n "$key" && test "$key" != None
                aws --endpoint-url http://garage.storage.svc.cluster.local:3900 s3api get-object --bucket postgres --key "$key" /tmp/baseline-object >/tmp/baseline-response
                printf 'baseline_key=%s\n' "$key"
                sha256sum /tmp/baseline-object
                wc -c /tmp/baseline-object
            env:
              AWS_DEFAULT_REGION: us-east-1
              AWS_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: aws-access-key-id
              AWS_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: aws-secret-access-key
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        seccompProfile: { type: RuntimeDefault }
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
