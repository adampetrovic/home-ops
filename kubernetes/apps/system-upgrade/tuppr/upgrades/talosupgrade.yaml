---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.6
  parallelism: 1
  policy:
    rebootMode: powercycle
    placement: hard
    # Wait for CSI detach so RBD claims don't hit Multi-Attach on another node.
    waitForVolumeDetach: true
    timeout: 45m
  hooks:
    pre:
      - name: suspend-backups
        image: &hookImage mirror.gcr.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
        serviceAccountName: &hookServiceAccount tuppr-hooks
        command: &hookCommand ["bash", "-c"]
        args:
          - |
            set -Eeuo pipefail
            kubectl get snapshotschedules.kopiur.home-operations.com -A -o json \
              | jq '{apiVersion: "v1", kind: "List", items: [.items[] | {
                  apiVersion, kind,
                  metadata: {name: .metadata.name, namespace: .metadata.namespace},
                  spec: {schedule: {suspend: true}}
                }]}' \
              | kubectl apply --server-side --field-manager=tuppr-upgrade --validate=false -f -
        env: &hookEnv
          - name: HOME
            value: /tmp
        volumeMounts: &hookVolumeMounts
          - name: tmp
            mountPath: /tmp
        volumes: &hookVolumes
          - name: tmp
            emptyDir: {}
    post:
      # Releasing the field manager drops the suspend it set, leaving no residue
      - name: resume-backups
        image: *hookImage
        serviceAccountName: *hookServiceAccount
        command: *hookCommand
        args:
          - |
            set -Eeuo pipefail
            kubectl get snapshotschedules.kopiur.home-operations.com -A -o json \
              | jq '{apiVersion: "v1", kind: "List", items: [.items[] | {
                  apiVersion, kind,
                  metadata: {name: .metadata.name, namespace: .metadata.namespace}
                }]}' \
              | kubectl apply --server-side --field-manager=tuppr-upgrade --validate=false -f -
        env: *hookEnv
        volumeMounts: *hookVolumeMounts
        volumes: *hookVolumes
        backoffLimit: 3
  silences:
    - matchers:
        - name: alertname
          matchType: "=~"
          value: >-
            ^(KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|KubeNodeEviction|KubePodNotReady|KubeContainerWaiting|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDaemonSetNotScheduled|KubeDaemonSetMisScheduled|TargetDown|AlertmanagerClusterFailedPeers|AlertmanagerMembersInconsistent|PrometheusNotConnectedToAlertmanagers|CephMonDown|CephMonDownQuorumAtRisk|CephOSDDown|CephOSDDownHigh|CephOSDHostDown|CephSlowOps|CephDaemonSlowOps|CephHealthWarning|CephPGsUnclean|CephFilesystemInsufficientStandby|CephFilesystemFailureNoStandby|etcdMembersDown|etcdHighNumberOfLeaderChanges|CNPGReplicationLagHigh|CNPGCollectorDown|NodeClockNotSynchronising|NodeNetworkInterfaceFlapping)$
      maxDuration: 2h
  healthChecks:
    # Schedules are suspended by the pre-hook, so this only waits out runs already in flight
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Running"])
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !has(status.phase) || !(status.phase in ["Resolving", "Restoring"])
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotReplication
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Replicating"])
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: RepositoryReplication
      expr: |-
        !has(status.phase) || !(status.phase in ["Pending", "Replicating"])
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Maintenance
      expr: |-
        !has(status.manualRun) || !has(status.manualRun.phase) || status.manualRun.phase != "Running"
    # A replica must be streaming again before the next drain can switch over to it
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: |-
        has(status.readyInstances) && status.readyInstances == object.spec.instances
    # Block on lost redundancy, not on benign warnings such as a crash report after a powercycle
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        has(status.ceph) && status.ceph.health != 'HEALTH_ERR' &&
        (!has(status.ceph.details) || !status.ceph.details.exists(k, k in [
          'MON_DOWN', 'OSD_DOWN', 'OSD_HOST_DOWN',
          'PG_AVAILABILITY', 'PG_DEGRADED', 'PG_DAMAGED', 'OBJECT_UNFOUND',
          'FS_DEGRADED', 'MDS_ALL_DOWN', 'MDS_INSUFFICIENT_STANDBY'
        ]))
