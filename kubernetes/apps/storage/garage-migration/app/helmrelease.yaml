---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-metadata-copy-v2
spec:
  interval: 1h
  timeout: 125m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      # Never repeat a partially completed recovery copy automatically.
      retries: 0
  upgrade:
    remediation:
      strategy: rollback
      retries: 0
  values:
    controllers:
      copy:
        type: job
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 7200
        initContainers:
          prepare-targets:
            image:
              repository: mirror.gcr.io/library/debian
              tag: bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
            command: ["/bin/bash", "-euc"]
            args:
              - |
                test -z "$(find /target -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit)"
                for path in /target /recovery; do
                  if test "$(stat -c %u:%g "$path")" != 568:568; then
                    chmod 2770 "$path"
                    chown 568:568 "$path"
                  fi
                  test "$(stat -c %a "$path")" = 2770
                  stat -c '%a %u:%g %n' "$path"
                done
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                add: [CHOWN]
        containers:
          app:
            image:
              repository: mirror.gcr.io/library/debian
              tag: bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
            command: ["/bin/bash", "-euc"]
            args:
              - |
                set -o pipefail
                umask 077
                export LC_ALL=C
                for path in /source-meta /source-data; do
                  awk -v p="$path" '$2==p {n=split($4,a,","); for(i=1;i<=n;i++) if(a[i]=="ro") ro=1; found=1} END {if(!found || !ro) exit 1}' /proc/mounts
                done
                test -r /source-meta/db.lmdb/data.mdb
                test -r /source-meta/node_key
                test -r /source-meta/node_key.pub
                test -z "$(find /target -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit)"
                point=/recovery/offline-20261011-v2
                test ! -e "$point"
                mkdir -m 700 "$point" "$point/meta" "$point/data"
                date -u '+offline_backup_start=%Y-%m-%dT%H:%M:%SZ' | tee "$point/start.txt"
                for tree in meta data; do
                  source="/source-$tree"
                  test -z "$(find "$source" -xdev ! -type f ! -type d ! -type l -print -quit)"
                  echo "Hashing offline source $tree"
                  (cd "$source"; find . -xdev -type f -print0 | sort -z | xargs -0 -r sha256sum) > "$point/$tree.source.sha256"
                  (cd "$source"; find . -xdev -printf '%P %y %m %T@ %l\0' | sort -z) > "$point/$tree.source.inventory"
                  echo "Copying whole $tree tree to independent Ceph recovery volume"
                  # NFS maps source owners to 977:988. Destination identity is intentionally 568:568.
                  # Preserve modes, timestamps, links and sparse content, not NFS-mapped numeric owners.
                  cp -a --sparse=always --no-preserve=ownership "$source/." "$point/$tree/"
                  # A setgid parent can add setgid to new directories despite cp's mode preservation.
                  # Restore every non-symlink's exact source mode; do not mask this in verification.
                  while IFS= read -r -d '' relative; do
                    chmod --reference="$source/$relative" "$point/$tree/$relative"
                  done < <(cd "$source"; find . -xdev ! -type l -print0)
                  sync
                  echo "Verifying all recovery $tree files against offline source SHA256"
                  (cd "$point/$tree"; sha256sum -c "$point/$tree.source.sha256") > "$point/$tree.recovery-verification.txt"
                  (cd "$point/$tree"; find . -xdev -printf '%P %y %m %T@ %l\0' | sort -z) > "$point/$tree.recovery.inventory"
                  cmp "$point/$tree.source.inventory" "$point/$tree.recovery.inventory"
                  echo "Rechecking source $tree to reject unexpected concurrent mutation"
                  (cd "$source"; sha256sum -c "$point/$tree.source.sha256") > "$point/$tree.source-recheck.txt"
                  (cd "$source"; find . -xdev -printf '%P %y %m %T@ %l\0' | sort -z) > "$point/$tree.source-recheck.inventory"
                  cmp "$point/$tree.source.inventory" "$point/$tree.source-recheck.inventory"
                  printf '%s_verified_files=' "$tree"
                  wc -l < "$point/$tree.recovery-verification.txt"
                  du -sB1 "$point/$tree"
                  sha256sum "$point/$tree.source.sha256"
                done
                echo 'Restoring the complete verified offline metadata backup to the migration target'
                cp -a --sparse=always --no-preserve=ownership "$point/meta/." /target/
                while IFS= read -r -d '' relative; do
                  chmod --reference="$point/meta/$relative" "/target/$relative"
                done < <(cd "$point/meta"; find . -xdev ! -type l -print0)
                sync
                (cd /target; sha256sum -c "$point/meta.source.sha256") > "$point/meta.target-verification.txt"
                (cd /target; find . -xdev -path ./lost+found -prune -o -printf '%P %y %m %T@ %l\0' | sort -z) > "$point/meta.target.inventory"
                cmp "$point/meta.source.inventory" "$point/meta.target.inventory"
                test -w /target/db.lmdb/data.mdb
                test -w /target/node_key
                test "$(stat -c %u:%g /target/node_key)" = 568:568
                test "$(stat -c %a /target/node_key)" = "$(stat -c %a /source-meta/node_key)"
                stat -c 'target_lmdb_bytes=%s allocated_blocks_512=%b owner=%u:%g mode=%a' /target/db.lmdb/data.mdb
                date -u '+offline_recovery_and_target_verified=%Y-%m-%dT%H:%M:%SZ' | tee "$point/VERIFIED"
                echo 'No source files excluded, no LMDB opened; whole metadata and matching data recovery verified'
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 250m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
    persistence:
      source-meta:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /var/nfs/shared/garage/meta
            readOnly: true
        globalMounts:
          - path: /source-meta
            readOnly: true
      source-data:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /var/nfs/shared/garage/data
            readOnly: true
        globalMounts:
          - path: /source-data
            readOnly: true
      target:
        existingClaim: garage-meta
        globalMounts:
          - path: /target
      recovery:
        existingClaim: garage-migration-recovery
        globalMounts:
          - path: /recovery
