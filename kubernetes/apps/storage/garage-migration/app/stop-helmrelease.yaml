---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-stop-obsolete-copy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      strategy: rollback
      retries: 0
  values:
    controllers:
      stop:
        type: job
        serviceAccount:
          name: garage-stop-obsolete-copy
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 120
        containers:
          app:
            image:
              repository: registry.k8s.io/kubectl
              tag: v1.34.0@sha256:497d298f891edb7608dfce9dae4bb08dffc4ddcd7f5d24a0512d4bbf33e04f26
            args:
              - delete
              - job
              - garage-metadata-copy-v2
              - --namespace=storage
              - --ignore-not-found=true
              - --wait=true
              - --timeout=60s
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      stop:
        forceRename: garage-stop-obsolete-copy
