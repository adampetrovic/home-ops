---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-stop-obsolete-copy
rules:
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [garage-metadata-copy-v2]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-stop-obsolete-copy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-stop-obsolete-copy
subjects:
  - kind: ServiceAccount
    name: garage-stop-obsolete-copy
    namespace: storage
