---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-backup-artifact-cleanup
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 0
  values:
    controllers:
      cleanup:
        type: job
        serviceAccount:
          name: garage-backup-artifact-cleanup
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 120
        initContainers:
          remove-completed-backup-jobs:
            image:
              repository: registry.k8s.io/kubectl
              tag: v1.34.0@sha256:497d298f891edb7608dfce9dae4bb08dffc4ddcd7f5d24a0512d4bbf33e04f26
            args: [delete, jobs, garage-meta-initial-nfs-20261011, garage-meta-initial-r2-20261011, garage-meta-verified-r2-20261011, garage-meta-nfs-20261011003114, garage-meta-nfs-20261011013124, --namespace=storage, --ignore-not-found=true, --wait=true, --timeout=60s]
        containers:
          app:
            image:
              repository: registry.k8s.io/kubectl
              tag: v1.34.0@sha256:497d298f891edb7608dfce9dae4bb08dffc4ddcd7f5d24a0512d4bbf33e04f26
            args: [delete, secrets, garage-meta-initial-nfs-20261011-pin-creds-0, garage-meta-initial-r2-20261011-pin-creds-0, garage-meta-verified-r2-20261011-pin-creds-0, garage-meta-nfs-vfy-creds-0, garage-meta-r2-vfy-creds-0, --namespace=storage, --ignore-not-found=true]
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      cleanup:
        forceRename: garage-backup-artifact-cleanup
