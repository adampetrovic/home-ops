---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/kopiur/backup
resources:
  - ./initial-snapshot.yaml
  - ./orphan-serviceaccount.yaml
patches:
  # Existing Bound claim: never add immutable dataSourceRef in place.
  - target:
      kind: PersistentVolumeClaim
      name: "\\$\\{APP\\}"
    patch: |-
      - op: remove
        path: /spec/dataSourceRef
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      group: kopiur.home-operations.com
      kind: Restore
      name: "\\$\\{APP\\}"
    patch: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      metadata:
        name: ${APP}
      $patch: delete
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/mover/ttlSecondsAfterFinished
        value: 300
      - op: add
        path: /spec/credentialProjection
        value:
          enabled: true
      - op: add
        path: /spec/hooks
        value:
          beforeSnapshot:
            - workloadExec:
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                    app.kubernetes.io/controller: garage
                container: app
                command: [/garage, meta, snapshot]
                timeout: 2m
                continueOnFailure: false
      - op: add
        path: /spec/files
        value:
          ignoreRules: ["/db.lmdb", "/db.lmdb/**", "/lost+found"]
      - op: add
        path: /spec/verification
        value:
          verifyFilesPercent: 100
          quick:
            schedule:
              cron: "H 5 * * *"
              timezone: Australia/Sydney
