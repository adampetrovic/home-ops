---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-meta-restore-proof-v3
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 0
  values:
    controllers:
      proof:
        type: job
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 600
        initContainers:
          prepare:
            image:
              repository: mirror.gcr.io/library/debian
              tag: bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
            command: [/bin/bash, -euc]
            args:
              - |
                set -o pipefail
                test ! -e /restored/db.lmdb/data.mdb
                for name in node_key node_key.pub cluster_layout data_layout; do
                  cmp "/live/$name" "/restored/$name"
                done
                point=$(find /restored/snapshots -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
                test -n "$point"
                stamp=$(basename "$point")
                [[ "$stamp" > "2026-10-11T00:57:00Z" ]]
                echo "native_metadata_recovery_point=$stamp"
                native="$point/db.lmdb"
                test -s "$native"
                # Kopia verified 100% of archived files; Garage rotates local
                # snapshots independently, so never rely on a live retained file.
                sha256sum "$native"
                mkdir /restored/db.lmdb
                cp -p "$native" /restored/db.lmdb/data.mdb
                chmod 770 /restored/db.lmdb
                chmod 660 /restored/db.lmdb/data.mdb
                cmp "$native" /restored/db.lmdb/data.mdb
                test -w /restored/db.lmdb/data.mdb
                test "$(stat -c %u:%g /restored/db.lmdb/data.mdb)" = 568:568
                echo 'R2 restore identity/layout and normalized native-snapshot bytes verified; raw running LMDB excluded; writable normalized metadata ready'
        containers:
          app:
            image:
              repository: mirror.gcr.io/dxflrs/garage
              tag: v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
            command: [/garage, convert-db, -a, lmdb, -i, /restored/db.lmdb, -b, sqlite, -o, /scratch/validated.sqlite, --lmdb-map-size, 1GiB]
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 384Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: garage
                  app.kubernetes.io/controller: garage
              topologyKey: kubernetes.io/hostname
    persistence:
      live:
        existingClaim: garage-meta
        globalMounts:
          - path: /live
            readOnly: true
      restored:
        existingClaim: garage-meta-restore-check-v2
        globalMounts:
          - path: /restored
      scratch:
        type: emptyDir
        globalMounts:
          - path: /scratch
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
