---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-migration-cleanup
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    resourceNames: [garage-metadata-copy-v2]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames:
      - garage-metadata-copy-v2
      - garage-meta-nfs-vfy-q-1760208440
      - garage-meta-r2-vfy-q-1760209065
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sh.helm.release.v1.garage-metadata-copy-v2.v1]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-migration-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-migration-cleanup
subjects:
  - kind: ServiceAccount
    name: garage-migration-cleanup
    namespace: storage
