---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage-data-inspect
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      strategy: rollback
  values:
    controllers:
      inspect:
        type: job
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command: ["/bin/sh", "-ec"]
            args:
              - |
                echo 'Read-only live data inspection, not a recovery point.'
                date -u '+inspection_start=%Y-%m-%dT%H:%M:%SZ'
                awk '$2 == "/data" { n=split($4,a,","); for(i=1;i<=n;i++) if(a[i]=="ro") ro=1; print "mountpoint=" $2, "type=" $3, "readonly=" (ro ? "true" : "false"); found=1 } END { if(!found || !ro) exit 1 }' /proc/mounts
                du -sk /data
                du -sb /data
                find /data -mindepth 1 -maxdepth 1 -exec stat -c '%F %a %u:%g %s %n' '{}' ';'
                find /data -xdev -type f | awk 'END {print "regular_files=" NR}'
                date -u '+inspection_end=%Y-%m-%dT%H:%M:%SZ'
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
    defaultPodOptions:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
    persistence:
      data:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_DOMAIN}
            path: /var/nfs/shared/garage/data
            readOnly: true
        globalMounts:
          - path: /data
            readOnly: true
