---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-dashboard
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - rook.petrovic.network
  rules:
    - backendRefs:
        - name: rook-ceph-mgr-dashboard
          port: 7000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-rgw
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - rgw.petrovic.network
  rules:
    - backendRefs:
        - name: rook-ceph-rgw-ceph-objectstore
          port: 80
