---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.36.0-standalone-strict/storageclass-storage-v1.json
# Kopiur mover caches live here rather than on ceph-block. Kopia evicts and
# rewrites cache files on every hourly backup, and without `discard` ext4 never
# hands the freed blocks back to RBD, so each cache eventually occupies its full
# capacity in Ceph regardless of how little it holds. Mount options are fixed
# when a volume is provisioned, so this needs its own class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block-cache
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
mountOptions:
  - discard
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
