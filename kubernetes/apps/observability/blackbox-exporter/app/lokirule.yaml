---
groups:
  - name: wan
    rules:
      # The UCG renews its WAN DHCP lease every 15 minutes.
      - alert: WANDHCPRenewalMissing
        expr: |
          absent_over_time({hostname="cloudkey"} |~ "dhcp-client: Synchronizing eth4 DHCP lease"[20m])
        for: 0s
        labels:
          severity: warning
          category: logs
        annotations:
          summary: "UCG has not renewed its WAN DHCP lease in 20 minutes — possible ISP/physical layer outage"
