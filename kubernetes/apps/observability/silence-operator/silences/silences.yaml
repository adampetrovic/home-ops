---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-pg-imbalance
spec:
  matchers:
    - name: alertname
      value: CephPGImbalance
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: etcd-high-fragmentation-ratio
spec:
  matchers:
    - name: alertname
      value: etcdDatabaseHighFragmentationRatio
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
# 1Password Connect PushSecrets with several entries for one item fail with a 400 on update
# Bug https://github.com/external-secrets/external-secrets/issues/7053
# Fix https://github.com/external-secrets/external-secrets/pull/7150
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: pushsecret-petrovic-network-production-tls
spec:
  matchers:
    - name: alertname
      value: PushSecretNotReady
    - name: exported_namespace
      value: network
    - name: name
      value: petrovic-network-production-tls
