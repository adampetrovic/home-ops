---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
# https://github.com/external-secrets/external-secrets/issues/7053
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: pushsecret-petrovic-network-production-tls
spec:
  matchers:
    - name: alertname
      value: PushSecretNotReady
    - name: exported_namespace
      value: network
    - name: name
      value: petrovic-network-production-tls
