---
data_dir: /vector-data-dir
timezone: "Australia/Sydney"
api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  kubernetes_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6010

  syslog_source:
    type: syslog
    address: 0.0.0.0:6020
    mode: udp

  talos_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6030

transforms:
  syslog_remap:
    type: remap
    inputs: ["syslog_source"]
    source: |
      # BSD syslog timestamps carry no timezone, so use the receive time.
      .timestamp = now()
      .hostname = del(.host)

  kubernetes_remap:
    type: remap
    inputs: ["kubernetes_source"]
    source: |
      .custom_app_name = .pod_labels."app.kubernetes.io/name" || .pod_labels.app || .pod_labels."k8s-app" || "unknown"
      del(.pod_labels)

  kubernetes_route:
    type: route
    inputs: ["kubernetes_remap"]
    route:
      home_assistant: '.custom_app_name == "home-assistant"'
      other: '.custom_app_name != "home-assistant"'

  home_assistant_remap:
    type: remap
    inputs: ["kubernetes_route.home_assistant"]
    source: |
      .message = replace!(.message, r'\x1b\[[0-9;]*m', "")

      parsed, err = parse_regex(.message, r'^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>\w+) \((?P<thread>[^)]+)\) \[(?P<component>[^\]]+)\] (?P<msg>.+)$')

      if err == null {
        .timestamp_parsed = parsed.timestamp
        .level = parsed.level
        .thread = parsed.thread
        .component = parsed.component
        .msg = parsed.msg

        component_parts = split!(parsed.component, ".")
        .component_type = component_parts[0]
        .component_name = get(component_parts, [1]) ?? ""
        .component_submodule = get(component_parts, [2]) ?? ""

        .severity = downcase!(parsed.level)

        del(.message)
      } else {
        .parse_error = "failed_to_parse_home_assistant_log"
        .level = "unknown"
        .component_type = "unknown"
        .component_name = "unknown"
      }

  talos_drop_debug:
    type: filter
    inputs: ["talos_source"]
    condition: 'downcase(to_string(.level) ?? "") != "debug"'

sinks:
  home_assistant:
    inputs: ["home_assistant_remap"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding: { codec: json }
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: 'home-assistant'
      namespace: '{{ kubernetes.pod_namespace }}'
      node: '{{ kubernetes.pod_node_name }}'
      source: 'kubernetes'
      level: '{{ level }}'
      component: '{{ component_type }}'
      component_name: '{{ component_name }}'

  kubernetes:
    inputs: ["kubernetes_route.other"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding: { codec: json }
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: '{{ custom_app_name }}'
      namespace: '{{ kubernetes.pod_namespace }}'
      node: '{{ kubernetes.pod_node_name }}'
      source: 'kubernetes'

  syslog:
    inputs: ["syslog_remap"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding: { codec: json }
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      hostname: '{{ hostname }}'
      source: 'syslog'

  talos:
    inputs: ["talos_drop_debug"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding: { codec: json }
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      source: 'talos'
      cluster: '{{ cluster }}'
      node: '{{ node }}'
      stream: '{{ stream }}'
      service: '{{ service }}'
      level: '{{ level }}'
