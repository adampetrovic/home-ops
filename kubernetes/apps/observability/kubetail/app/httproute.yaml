---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubetail
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - kubetail.petrovic.network
  rules:
    - backendRefs:
        - name: kubetail-dashboard
          port: 8080
