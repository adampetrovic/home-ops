---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubetail
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kubetail
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    kubetail:
      dashboard:
        enabled: true
        authMode: auto
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-dashboard
          tag: 0.17.2@sha256:c26219b046d70de17830036de65907dba45308f79cb87009927c55303d6dbad0
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000
        runtimeConfig:
          csrf:
            enabled: false
          session:
            cookie:
              secure: true
        service:
          ports:
            http: 8080

      clusterAPI:
        enabled: true
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-cluster-api
          tag: 0.8.2@sha256:8e6acd0da9ac6ec5cfe5caa41b6441e0bece2bbf962775e8bd2054568e3c912a
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000

      clusterAgent:
        enabled: true
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-cluster-agent
          tag: 0.7.1@sha256:a5eee8cab215aa296b432e91c2f24fe984f572e51b6ade5240aecca483f39393
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - DAC_READ_SEARCH
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000
        podTemplate:
          securityContext:
            fsGroup: 0
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
