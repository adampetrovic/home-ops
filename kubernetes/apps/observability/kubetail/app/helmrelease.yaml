---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubetail
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kubetail
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    kubetail:
      dashboard:
        enabled: true
        authMode: auto
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-dashboard
          tag: 0.17.0@sha256:8617f0a7f7039a3160906719e801c224b9d889008f2168e1c4a7bf36ec463664
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000
        runtimeConfig:
          csrf:
            enabled: false
          session:
            cookie:
              secure: true
        service:
          ports:
            http: 8080

      clusterAPI:
        enabled: true
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-cluster-api
          tag: 0.8.4@sha256:9f0b1b990154dc3d6e292211e536acf188650b80903774539844519685beb2fb
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000

      clusterAgent:
        enabled: true
        image:
          registry: ghcr.io
          repository: kubetail-org/kubetail-cluster-agent
          tag: 0.7.1@sha256:a5eee8cab215aa296b432e91c2f24fe984f572e51b6ade5240aecca483f39393
        container:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - DAC_READ_SEARCH
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000
        podTemplate:
          securityContext:
            fsGroup: 0
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
