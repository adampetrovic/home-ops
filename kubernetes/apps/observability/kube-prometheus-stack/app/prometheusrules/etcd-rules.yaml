---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: etcd-overrides
      rules:
        - alert: etcdMemberCommunicationSlow
          annotations:
            description: >-
              etcd cluster "{{ $labels.job }}": member communication with
              {{ $labels.To }} is taking {{ $value }}s on etcd instance {{ $labels.instance }}.
            summary: etcd cluster member communication is slow.
          expr: |-
            histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{job=~".*etcd.*"}[5m]))
            > 0.25
          for: 10m
          labels:
            severity: warning

        - alert: etcdDatabaseHighFragmentationRatio
          annotations:
            description: >-
              etcd cluster "{{ $labels.job }}": instance {{ $labels.instance }}
              uses only {{ $value | humanizePercentage }} of its allocated database
              file, and that file is over half of the backend quota. Defragment it
              with talosctl etcd defrag before it reaches the quota.
            summary: Fragmented etcd database is approaching its backend quota.
          expr: |-
            (
              last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m])
                / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])
            ) < 0.5
            and
            (
              last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])
                / last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m])
            ) > 0.5
          for: 10m
          labels:
            severity: warning
