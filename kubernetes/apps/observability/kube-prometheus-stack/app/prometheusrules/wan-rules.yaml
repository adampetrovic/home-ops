---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wan-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: wan
      rules:
        - record: wan:probe_success:avg
          expr: avg(probe_success{probe="wan"})

        - alert: WANDown
          annotations:
            summary: "Internet connectivity is down — all WAN probes failing"
          expr: wan:probe_success:avg == 0
          for: 2m
          labels:
            severity: critical

        - alert: WANDownBuffer
          annotations:
            summary: "WAN outage active or recently recovered — suppressing dependent alerts"
          # Holds for 10m after WANDown resolves, while dependent alerts settle.
          expr: max_over_time(ALERTS{alertname="WANDown", alertstate="firing"}[10m]) == 1
          labels:
            severity: none
