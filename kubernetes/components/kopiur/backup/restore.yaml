---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${KOPIUR_RESTORE_NAME:=${APP}}
spec:
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${KOPIUR_RESTORE_POLICY:=${APP}-nfs}
      offset: 0
  target:
    populator: {}
