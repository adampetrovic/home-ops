---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: ClusterRepository
    name: ${KOPIUR_REPOSITORY:-kopiur-r2}
  sources:
    - pvc:
        name: ${KOPIUR_SOURCE_PVC}
      readOnly: true
  copyMethod: Snapshot
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS}
  compression:
    compressor: zstd
  errorHandling:
    failFast: true
    ignoreFileErrors: false
    ignoreDirErrors: false
    ignoreUnknownTypes: false
  defaultDeletionPolicy: Retain
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 1
  mover:
    cache:
      mode: Persistent
      capacity: ${KOPIUR_CACHE_CAPACITY:-2Gi}
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:-ceph-block}
    securityContext:
      runAsNonRoot: true
      runAsUser: ${KOPIUR_PUID:-568}
      runAsGroup: ${KOPIUR_PGID:-568}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: ${KOPIUR_PUID:-568}
      runAsGroup: ${KOPIUR_PGID:-568}
      fsGroup: ${KOPIUR_PGID:-568}
      fsGroupChangePolicy: OnRootMismatch
