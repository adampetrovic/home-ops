---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: ${job}
  namespace: ${ns}
  labels:
    app.kubernetes.io/name: volsync-r2-check
    app.kubernetes.io/managed-by: just
    home-ops.petrovic.io/volsync-app: ${app}
spec:
  activeDeadlineSeconds: ${timeout}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volsync-r2-check
        app.kubernetes.io/managed-by: just
        home-ops.petrovic.io/volsync-app: ${app}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: r2
          # renovate: datasource=docker depName=restic/restic
          image: mirror.gcr.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
          args:
            - --no-cache
            - --stuck-request-timeout
            - 2m
            - check
          envFrom:
            - secretRef:
                name: ${app}-volsync-r2-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
