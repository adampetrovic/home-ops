---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-vars
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cluster-vars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_PUBLIC_DOMAIN: "{{ .SECRET_PUBLIC_DOMAIN }}"
        SECRET_PUBLIC_ANON_DOMAIN: "{{ .SECRET_PUBLIC_ANON_DOMAIN }}"
        SECRET_PLEX_DOMAIN: "{{ .SECRET_PLEX_DOMAIN }}"
        SECRET_CLOUDFLARE_EMAIL: "{{ .SECRET_CLOUDFLARE_EMAIL }}"
        SECRET_CLOUDFLARE_ACCOUNT_ID: "{{ .SECRET_CLOUDFLARE_ACCOUNT_ID }}"
        SECRET_CLOUDFLARE_TUNNEL_ID: "{{ .SECRET_CLOUDFLARE_TUNNEL_ID }}"
  dataFrom:
    - extract:
        key: cluster-secrets
